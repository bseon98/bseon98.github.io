  function computePages(L,pageLen){
    const horiz=L.horiz,longDim=horiz?L.W:L.H;
    if(!pageLen||longDim<=pageLen)return[[0,longDim]];
    const its=L.items.slice().sort((a,b)=>a.pt-b.pt);
    if(!its.length)return[[0,longDim]];
    const pages=[];let start=0,i=0;
    while(i<its.length){
      let j=i;
      while(j<its.length&&(its[j].hi-start)<=pageLen)j++;
      if(j===i)j=i+1;
      const last=its[j-1];let end;
      if(j<its.length){const next=its[j];end=Math.min(Math.max(last.hi+8,(last.hi+next.lo)/2),start+pageLen);end=Math.max(end,last.hi+4);}
      else end=longDim;
      pages.push([start,Math.min(end,longDim)]);start=end;i=j;
    }
    return pages;
  }
  function rasterize(markup,W,H,scale,cb){
    const img=new Image();
    img.onload=()=>{const cv=document.createElement("canvas");cv.width=W*scale;cv.height=H*scale;
      const ctx=cv.getContext("2d");ctx.fillStyle="#fff";ctx.fillRect(0,0,cv.width,cv.height);ctx.drawImage(img,0,0,cv.width,cv.height);cb(cv);};
    img.onerror=()=>toast("이미지 변환 실패 — SVG로 내보내 보세요");
    img.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(markup);
  }
  function exportTLSVG(){const L=computeLayout();const url="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svgMarkup(L,{}));tlDownload(tlFname()+".svg",url);}
  function exportTLPNG(){
    const L=computeLayout(),horiz=L.horiz,longDim=horiz?L.W:L.H,scale=2,pageLen=TS.pageLen;
    if(!pageLen||longDim<=pageLen){
      rasterize(svgMarkup(L,{}),L.W,L.H,scale,cv=>{cv.toBlob(b=>{const u=URL.createObjectURL(b);tlDownload(tlFname()+".png",u);setTimeout(()=>URL.revokeObjectURL(u),5000);},"image/png");});
      return;
    }
    const pages=computePages(L,pageLen);
    rasterize(svgMarkup(L,{noTitle:true}),L.W,L.H,scale,master=>{
      pages.forEach((pg,idx)=>{setTimeout(()=>{
        const[s0,e0]=pg;const pw=horiz?(e0-s0):L.W,ph=horiz?L.H:(e0-s0);
        const cv=document.createElement("canvas");cv.width=pw*scale;cv.height=ph*scale;
        const ctx=cv.getContext("2d");ctx.fillStyle="#fff";ctx.fillRect(0,0,cv.width,cv.height);
        if(horiz)ctx.drawImage(master,s0*scale,0,pw*scale,ph*scale,0,0,pw*scale,ph*scale);
        else ctx.drawImage(master,0,s0*scale,pw*scale,ph*scale,0,0,pw*scale,ph*scale);
        if(TS.title){ctx.fillStyle=TS.textColor;ctx.font=`600 ${(TS.fontSize+7)*scale}px Georgia, serif`;ctx.fillText(TS.title,24*scale,34*scale);}
        const tag=`${idx+1} / ${pages.length}`;ctx.fillStyle="#5a616e";ctx.font=`${12*scale}px system-ui, sans-serif`;
        ctx.fillText(tag,cv.width-(14+tag.length*7)*scale,cv.height-10*scale);
        cv.toBlob(b=>{const u=URL.createObjectURL(b);tlDownload(`${tlFname()}-${idx+1}.png`,u);setTimeout(()=>URL.revokeObjectURL(u),5000);},"image/png");
      },idx*450);});
    });
  }

  /* ---- 연표 .json 내보내기/가져오기 (세계관과 별개 파일) ---- */
  function tlSaveJSON(){
    const {id,...rest}=TS; // id는 이 세계관 내부용이라 뺌
    const url="data:application/json;charset=utf-8,"+encodeURIComponent(JSON.stringify(rest));
    tlDownload(tlFname()+".timeline.json",url);
    toast("이 연표를 내보냈어요");
  }
  function tlLoadJSON(file){
    const r=new FileReader();
    r.onload=()=>{try{
      const o=JSON.parse(r.result);
      const tl=normalizeTimeline(Object.assign({id:uid()}, o));
      tl.name=tl.name||"가져온 연표";
      state.timelines.push(tl); state._curTL=tl.id;
      persist(); tlSwitchTo(tl.id); toast("연표를 가져왔어요");
    }catch(err){ toast("불러오기 실패: "+err.message); }};
    r.readAsText(file);
  }

  function bindTLControls(){
    const q=id=>$("#tlw "+id);
    const bindRange=(id,key,valId,suffix,sub)=>{const el=q(id); if(!el)return; el.addEventListener("input",e=>{const v=parseInt(e.target.value);if(sub)TS[sub][key]=v;else TS[key]=v;if(valId){const t=q(valId);if(t)t.textContent=v+(suffix||"");}renderTimelineSVG();});};
    q("#c-title").addEventListener("input",e=>{TS.title=e.target.value;renderTimelineSVG();});
    q("#c-precision").addEventListener("change",e=>{TS.precision=parseInt(e.target.value);renderTLEvents();renderTimelineSVG();});
    ["mo","d","h","min"].forEach(k=>{q("#r-"+k).addEventListener("input",e=>{TS.ratios[k]=parseFloat(e.target.value)||1;renderTimelineSVG();});});
    q("#c-line-color").addEventListener("input",e=>{TS.lineColor=e.target.value;renderTimelineSVG();});
    q("#c-point-color").addEventListener("input",e=>{TS.pointColor=e.target.value;renderTimelineSVG();});
    q("#c-text-color").addEventListener("input",e=>{TS.textColor=e.target.value;renderTimelineSVG();});
    bindRange("#c-point-size","pointSize","#v-point","");
    bindRange("#c-line-thick","lineThick","#v-line","");
    bindRange("#c-font-size","fontSize","#v-font","");
    bindRange("#c-label-w","labelWidth","#v-lw","");
    bindRange("#c-gap","gap","#v-gap","");
    bindRange("#c-page","pageLen","#v-page","");
    bindRange("#c-bg-scale","scale","#v-bg-scale","%","bg");
    bindRange("#c-bg-x","x","#v-bg-x","","bg");
    bindRange("#c-bg-y","y","#v-bg-y","","bg");
    bindRange("#c-bg-op","opacity","#v-bg-op","%","bg");
    q("#c-reverse").addEventListener("change",e=>{TS.reverse=e.target.checked;renderTimelineSVG();});
    q("#c-grid").addEventListener("change",e=>{TS.showGrid=e.target.checked;renderTimelineSVG();});
    q("#c-legend").addEventListener("change",e=>{TS.showLegend=e.target.checked;renderTimelineSVG();});
    q("#c-orient").querySelectorAll("button").forEach(b=>{b.onclick=()=>{TS.orientation=b.getAttribute("data-v");syncTLControls();renderTLEvents();renderTimelineSVG();};});
    q("#c-spacing").querySelectorAll("button").forEach(b=>{b.onclick=()=>{TS.spacing=b.getAttribute("data-v");syncTLControls();renderTimelineSVG();};});
    q("#c-bg-pick").onclick=()=>q("#c-bg-file").click();
    q("#c-bg-file").addEventListener("change",e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{TS.bg.data=r.result;setBgStatus();renderTimelineSVG();};r.readAsDataURL(f);e.target.value="";});
    q("#c-bg-remove").onclick=()=>{TS.bg.data=null;setBgStatus();renderTimelineSVG();};
    q("#c-add-track").onclick=()=>{TS.tracks.push(newTLTrack());normalizeTracks();renderTLTracks();renderTLEvents();renderTimelineSVG();};
    q("#c-add-ev").onclick=()=>{TS.events.push(newTLEvent());renderTLEvents();renderTimelineSVG();};
    q("#c-auto").onclick=autoArrange;
    q("#c-add-period").onclick=()=>{TS.periods.push(newTLPeriod());renderTLPeriods();renderTimelineSVG();};
    q("#c-add-marker").onclick=()=>{TS.markers.push(newTLMarker());renderTLMarkers();renderTimelineSVG();};
    q("#c-save").onclick=tlSaveJSON;
    q("#c-load-pick").onclick=()=>q("#c-load-file").click();
    q("#c-load-file").addEventListener("change",e=>{if(e.target.files[0])tlLoadJSON(e.target.files[0]);e.target.value="";});
    q("#t-png").onclick=exportTLPNG; q("#t-svg").onclick=exportTLSVG;
    q("#t-zoom").addEventListener("input",e=>{TLzoom=parseInt(e.target.value);q("#v-zoom").textContent=TLzoom+"%";applyZoom();});
    q("#t-100").onclick=()=>{TLzoom=100;q("#t-zoom").value=100;q("#v-zoom").textContent="100%";applyZoom();};
    q("#t-fit").onclick=()=>{const L=computeLayout();const wrap=q(".canvas-wrap");const avail=(wrap?wrap.clientWidth:900)-52;TLzoom=Math.max(20,Math.min(200,Math.floor(avail/L.W*100)));q("#t-zoom").value=TLzoom;q("#v-zoom").textContent=TLzoom+"%";applyZoom();};
  }
  function applyZoom(){const svg=$("#tlw #tl-svg"); if(!svg) return; const w=parseFloat(svg.getAttribute("width")),h=parseFloat(svg.getAttribute("height")),z=TLzoom/100; svg.style.width=(w*z)+"px"; svg.style.height=(h*z)+"px";}

  function renderTimelineSVG(){
    const wrap=$("#tlw .canvas-wrap"); if(!wrap) return;
    const L=computeLayout();
    const cur0=wrap.querySelector("#tl-svg"); if(cur0) cur0.outerHTML=svgMarkup(L,{});
    const svg=wrap.querySelector("#tl-svg"); if(!svg) return;
    const z=TLzoom/100;
    svg.style.width=(L.W*z)+"px"; svg.style.height=(L.H*z)+"px";
    svg.setAttribute("width",L.W); svg.setAttribute("height",L.H);
    const foot=$("#tlw #foot");
    if(foot) foot.textContent=`사건 ${validEvents().length}개 · 트랙 ${TS.tracks.length||1} · ${TS.orientation==="horizontal"?"가로":"세로"} · ${PLABEL.slice(0,TS.precision).join("·")} · ${Math.round(L.W)}×${Math.round(L.H)}px`;
    svg.querySelectorAll(".tl-ev").forEach(g=> g.addEventListener("click",()=>{
      const ev=TS.events.find(x=>String(x.id)===g.getAttribute("data-ev")); if(ev) openEventDoc(ev);
    }));
    tlTouch();
  }

  /* ---- 연표 전환/추가/이름/삭제 ---- */
  function tlSwitchTo(id){
    state._curTL=id; persist(); renderTimelineWorkspace();
  }
  function addTimeline(){
    promptModal("새 연표","","만들기",(nm)=>{
      const tl=newTimeline(nm); state.timelines.push(tl); state._curTL=tl.id; persist(); renderTimelineWorkspace();
    });
  }
  function renameTimeline(){
    if(!TS) return;
    promptModal("연표 이름 바꾸기",TS.name,"변경",(nm)=>{ TS.name=nm; if(!TS.title) TS.title=nm; persist(); renderTimelineWorkspace(); });
  }
  function deleteTimeline(){
    if(!TS) return;
    confirmModal(`'${TS.name}' 연표를 삭제할까요?`,"연대표만 지워집니다. 연결된 위키 문서는 그대로 남습니다.","삭제",()=>{
      state.timelines=state.timelines.filter(t=>t.id!==TS.id);
      state._curTL=state.timelines[0]?state.timelines[0].id:null;
      persist(); renderTimelineWorkspace();
    });
  }

  /* ---- 워크스페이스 전체 렌더 ---- */
  function timelinePanelHTML(){
    const opts=state.timelines.map(t=>`<option value="${t.id}" ${t.id===TS.id?"selected":""}>${tlesc(t.name)}</option>`).join("");
    return `
      <div class="tl-switch">
        <div class="lbl">연표 — ${tlesc(state.meta.name)}</div>
        <select id="tl-picker">${opts}</select>
        <div class="row2">
          <button class="btn" id="tl-new">＋ 새 연표</button>
          <button class="btn" id="tl-rename">이름</button>
          <button class="btn" id="tl-del">삭제</button>
        </div>
      </div>
      <details class="sec" open><summary>기본</summary><div class="sec-body">
        <div class="field"><label>연표 제목(그림에 표시)</label><input type="text" id="c-title" placeholder="예: 로드웰 가문 연대기"></div>
        <div class="field"><label>방향</label><div class="seg" id="c-orient"><button data-v="horizontal" class="on">가로</button><button data-v="vertical">세로</button></div></div>
        <div class="field"><label>포인트 간격 기준</label><div class="seg" id="c-spacing"><button data-v="even" class="on">균등 간격</button><button data-v="proportional">시간 비례</button></div>
          <div class="hint">균등: 시간 차이와 무관하게 일정 간격 / 비례: 실제 시간 차이만큼 벌어짐</div></div>
        <div class="field"><label>표시 옵션</label><div class="toggles">
          <label class="toggle"><input type="checkbox" id="c-reverse"> 방향 뒤집기 (끝 ↔ 시작)</label>
          <label class="toggle"><input type="checkbox" id="c-grid"> 눈금 표시</label>
          <label class="toggle"><input type="checkbox" id="c-legend" checked> 트랙 범례 표시</label></div></div>
      </div></details>
      <details class="sec" open><summary>시간 단위</summary><div class="sec-body">
        <div class="field"><label>정밀도 (이 연표의 축 단위)</label>
          <select id="c-precision"><option value="1">년</option><option value="2">년 · 월</option><option value="3">년 · 월 · 일</option><option value="4">년 · 월 · 일 · 시</option><option value="5">년 · 월 · 일 · 시 · 분</option></select>
          <div class="hint">정렬은 이 단위들을 차례로 비교하므로 가공의 역법이어도 정확합니다.</div></div>
        <div class="field"><label>비례 간격 환산 (‘시간 비례’일 때만)</label>
          <div class="ratio-row">1년 = <input type="number" id="r-mo" value="12"> 월</div>
          <div class="ratio-row">1월 = <input type="number" id="r-d" value="30"> 일</div>
          <div class="ratio-row">1일 = <input type="number" id="r-h" value="24"> 시</div>
          <div class="ratio-row">1시 = <input type="number" id="r-min" value="60"> 분</div></div>
      </div></details>
      <details class="sec" open><summary>사건</summary><div class="sec-body">
        <div id="ev-list"></div>
        <button class="btn ghost" id="c-add-ev">＋ 사건 추가</button>
        <button class="linkbtn" id="c-auto" style="margin-top:8px">라벨 자동 배치(위·아래 번갈아)</button>
        <div class="hint">사건 <b>제목</b>이 곧 위키 문서 이름입니다. 제목을 적고 칸을 벗어나면 그 이름의 위키 문서가 자동으로 생기고, 연대표에서 사건을 누르면 그 문서로 넘어갑니다.</div>
      </div></details>
      <details class="sec"><summary>트랙 (선 여러 줄)</summary><div class="sec-body">
        <div id="track-list"></div><button class="btn ghost" id="c-add-track">＋ 트랙 추가</button>
        <div class="hint">인물·플롯별로 선을 나눠 같은 시간축에 나란히 놓습니다.</div></div></details>
      <details class="sec"><summary>기간 (구간 띠)</summary><div class="sec-body">
        <div id="period-list"></div><button class="btn ghost" id="c-add-period">＋ 기간 추가</button>
        <div class="hint">시작·끝은 점(.)으로 이어 씁니다 — 예: 1915 또는 1915.3.20.</div></div></details>
      <details class="sec"><summary>기준선</summary><div class="sec-body">
        <div id="marker-list"></div><button class="btn ghost" id="c-add-marker">＋ 기준선 추가</button>
        <div class="hint">특정 시점에 ‘현재’ 같은 선을 긋습니다.</div></div></details>
      <details class="sec"><summary>크기 · 스타일</summary><div class="sec-body">
        <div class="field"><label>사건 간격(연대표 길이) <span class="val" id="v-gap">150</span></label><input type="range" id="c-gap" min="70" max="520" value="150"></div>
        <div class="trow">
          <div class="field"><label>선 색</label><input type="color" id="c-line-color" value="#1d2730"></div>
          <div class="field"><label>포인트 색</label><input type="color" id="c-point-color" value="#0c63bd"></div>
          <div class="field"><label>글자 색</label><input type="color" id="c-text-color" value="#1d2730"></div></div>
        <div class="field"><label>포인트 크기 <span class="val" id="v-point">7</span></label><input type="range" id="c-point-size" min="3" max="16" value="7"></div>
        <div class="field"><label>선 두께 <span class="val" id="v-line">2</span></label><input type="range" id="c-line-thick" min="1" max="8" value="2"></div>
        <div class="field"><label>글자 크기 <span class="val" id="v-font">13</span></label><input type="range" id="c-font-size" min="9" max="24" value="13"></div>
        <div class="field"><label>라벨 최대 너비 <span class="val" id="v-lw">180</span></label><input type="range" id="c-label-w" min="90" max="340" value="180"></div>
      </div></details>
      <details class="sec"><summary>배경 이미지</summary><div class="sec-body">
        <div class="field"><button class="btn ghost" id="c-bg-pick">이미지 불러오기</button>
          <input type="file" id="c-bg-file" accept="image/*" class="file-hidden"><div class="bg-status" id="bg-status">배경 없음</div></div>
        <div class="field"><label>크기 <span class="val" id="v-bg-scale">100%</span></label><input type="range" id="c-bg-scale" min="20" max="300" value="100"></div>
        <div class="trow">
          <div class="field"><label>가로 위치 <span class="val" id="v-bg-x">0</span></label><input type="range" id="c-bg-x" min="-100" max="100" value="0"></div>
          <div class="field"><label>세로 위치 <span class="val" id="v-bg-y">0</span></label><input type="range" id="c-bg-y" min="-100" max="100" value="0"></div></div>
        <div class="field"><label>투명도 <span class="val" id="v-bg-op">100%</span></label><input type="range" id="c-bg-op" min="0" max="100" value="100"></div>
        <button class="linkbtn danger" id="c-bg-remove">배경 지우기</button></div></details>
      <details class="sec"><summary>이 연표 파일로 · 분할</summary><div class="sec-body">
        <div class="trow" style="margin-bottom:8px">
          <button class="btn" id="c-save">연표 내보내기</button>
          <button class="btn" id="c-load-pick">연표 가져오기</button>
          <input type="file" id="c-load-file" accept="application/json,.json" class="file-hidden"></div>
        <div class="field"><label>PNG 분할 길이(px) <span class="val" id="v-page">0</span></label><input type="range" id="c-page" min="0" max="4000" step="100" value="0">
          <div class="hint">0이면 한 장. 값을 정하면 PNG가 그 길이를 넘길 때 사건 사이에서 잘라 여러 장으로 저장합니다.</div></div></div></details>`;
  }
  function renderTimelineWorkspace(){
    const view=$("#view");
    // 연표가 하나도 없으면 빈 화면
    if(!state.timelines.length){
      view.innerHTML=`<div id="tlw"><div class="tl-empty"><div style="font-size:15px;color:var(--ink);margin-bottom:6px">‘${tlesc(state.meta.name)}’에 아직 연표가 없어요.</div>
        <div style="margin-bottom:16px">연표를 만들면 사건이 곧 위키 문서가 됩니다.</div>
        <button class="btn primary" id="tl-first">＋ 연표 만들기</button></div></div>`;
      const b=$("#tlw #tl-first"); if(b) b.onclick=addTimeline;
      return;
    }
    TS=curTimeline(); state._curTL=TS.id;
    view.innerHTML=`<div id="tlw">
      <aside class="tl-panel">${timelinePanelHTML()}</aside>
      <main class="tl-stage">
        <div class="tl-toolbar">
          <div class="grp"><button class="btn" id="t-fit">화면 맞춤</button><button class="btn" id="t-100">실제 크기</button></div>
          <div class="divider"></div>
          <div class="grp" style="align-items:center;gap:6px"><span class="val">확대</span><input type="range" id="t-zoom" min="20" max="200" value="100" style="width:110px"><span class="val" id="v-zoom">100%</span></div>
          <div class="sp"></div>
          <div class="grp"><button class="btn primary" id="t-png">PNG 내보내기</button><button class="btn" id="t-svg">SVG 내보내기</button></div>
        </div>
        <div class="canvas-wrap" id="canvas-wrap"><svg id="tl-svg" xmlns="http://www.w3.org/2000/svg"></svg></div>
        <div class="footnote" id="foot">사건을 추가하면 연대표가 그려집니다.</div>
      </main></div>`;
    // 연표 전환 컨트롤
    const picker=$("#tlw #tl-picker"); if(picker) picker.addEventListener("change",e=>tlSwitchTo(e.target.value));
    const bn=$("#tlw #tl-new"); if(bn) bn.onclick=addTimeline;
    const br=$("#tlw #tl-rename"); if(br) br.onclick=renameTimeline;
    const bd=$("#tlw #tl-del"); if(bd) bd.onclick=deleteTimeline;
    bindTLControls();
    syncTLControls();
    renderTLTracks(); renderTLPeriods(); renderTLMarkers(); renderTLEvents();
    renderTimelineSVG();
  }

  /* ---------- 시작 ---------- */
  function init(){
    library = load();
    setCurrentWorld(library.currentId);
    if(READONLY){
      // 복사·잘라내기·붙여넣기·우클릭·드래그·선택 차단 (검색창은 예외)
      document.body.classList.add("locked");
      const inSearch = e => e.target && e.target.id==="searchIn";
      ["copy","cut","paste","contextmenu","dragstart","selectstart"].forEach(ev=>{
        document.addEventListener(ev, e=>{ if(inSearch(e)) return; e.preventDefault(); }, true);
      });
    } else {
      $("#worldName").addEventListener("input", e=>{ state.meta.name=e.target.value; save(); renderSide(); });
      $("#worldName").addEventListener("blur",()=>{ if(!state.meta.name.trim()){ state.meta.name="이름 없는 세계"; $("#worldName").value=state.meta.name; save(); renderSide(); }});
    }
    $("#menuToggle").addEventListener("click", e=>{
      e.stopPropagation();
      const open = $("#side").classList.toggle("open");
      $("#sideBackdrop").classList.toggle("show", open);
    });
    $("#sideBackdrop").addEventListener("click", closeSideMobile);
    const amb=$("#actionsMenuBtn");
    if(amb) amb.addEventListener("click", e=>{ e.stopPropagation(); $("#topActions").classList.toggle("open"); });
    // 액션 선택 시 메뉴 닫기 + 바깥 탭하면 닫기
    $("#topActions").addEventListener("click", e=>{
      if(e.target.classList && e.target.classList.contains("btn")) $("#topActions").classList.remove("open");
    });
    document.addEventListener("click", e=>{
      const ta=$("#topActions");
      if(ta.classList.contains("open") && !ta.contains(e.target) && e.target.id!=="actionsMenuBtn") ta.classList.remove("open");
    });
    document.addEventListener("keydown", e=>{
      if(READONLY){
        const k=(e.key||"").toLowerCase();
        if((e.ctrlKey||e.metaKey) && ["c","x","v","a","s","p"].includes(k) && !(e.target&&e.target.id==="searchIn")){ e.preventDefault(); }
        return;
      }
      if((e.ctrlKey||e.metaKey)&&e.key==="s"){ e.preventDefault(); if(cur.mode==="edit") saveEditor(); else exportHTML(); }
      if((e.ctrlKey||e.metaKey)&&e.key==="e"){ e.preventDefault(); if(cur.docId){ cur.mode=cur.mode==="edit"?"view":"edit"; renderAll(); } }
    });
    renderAll();
  }
  init();
})();
</script>
</body>
</html>
