<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>코덱스 — 세계관 위키</title>
<!-- 데이터 보관소: 단일 HTML로 내보내면 여기에 세계관 전체가 박제됩니다 -->
<script id="embedded-data" type="application/json"></script>
<style>
  :root{
    --ink:#1d2730;           /* 본문 잉크(짙은 청회먹) */
    --paper:#f2f5f8;         /* 종이(아주 옅은 한색) */
    --panel:#e7edf2;         /* 사이드바 */
    --panel-edge:#d3dde5;
    --line:#d3dde5;          /* 괘선 */
    --muted:#5d6b76;         /* 보조 텍스트 */
    --rubric:#0c63bd;        /* 짙은 azure — 링크/표제(#0080FF 계열, 읽기 좋게) */
    --rubric-soft:#8fb6db;   /* 비어있는 문서(흐린 azure 링크) */
    --ochre:#2f7d6e;         /* 태그(낮은 채도의 청록) */
    --hero:#0080FF;          /* 시그니처 azure — primary 버튼/포인트 */
    --celadon:#d2e6f8;       /* 선택/강조 표면(연한 azure) — 변수명 유지 */
    --sel:#dde8f1;
    --surface:#ffffff;      /* 카드·컨트롤 표면(테마 따라 바뀜) */
    --radius:7px;
    --mono:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;
    --sans:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Pretendard','Malgun Gothic','맑은 고딕',Roboto,'Noto Sans KR',sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    font-family:var(--sans);color:var(--ink);background:var(--paper);
    font-size:15px;line-height:1.72;-webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit}
  /* ===== 상단 바 ===== */
  .topbar{
    height:54px;display:flex;align-items:center;gap:14px;padding:0 18px;
    background:var(--paper);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;
  }
  .brand{display:flex;align-items:baseline;gap:9px;min-width:0;flex:1}
  .brand .mark{color:var(--rubric);font-weight:700;letter-spacing:.14em;font-size:11px;text-transform:uppercase;white-space:nowrap}
  .brand .worldname{font-weight:650;font-size:17px;letter-spacing:-.01em;border:0;background:transparent;color:var(--ink);
    padding:3px 6px;border-radius:6px;min-width:60px;max-width:46vw;}
  .brand .worldname:hover{background:var(--sel)}
  .brand .worldname:focus{outline:none;background:var(--surface);box-shadow:0 0 0 2px var(--line)}
  .actions{display:flex;gap:7px;flex-wrap:nowrap;align-items:center}
  /* 더보기 드롭다운 */
  .more-wrap{position:relative}
  .more-menu{position:absolute;top:calc(100% + 7px);right:0;display:none;flex-direction:column;align-items:stretch;gap:2px;
    background:var(--paper);border:1px solid var(--line);border-radius:11px;padding:7px;min-width:210px;max-height:76vh;overflow:auto;
    box-shadow:0 14px 40px rgba(20,40,70,.22);z-index:60}
  .more-menu.open{display:flex}
  .more-menu .btn{width:100%;text-align:left;border:0;background:transparent;padding:10px 12px;font-size:14px;border-radius:8px}
  .more-menu .btn:hover{background:var(--sel)}
  .more-menu .btn.primary{background:var(--celadon);color:var(--ink);font-weight:600;margin-top:2px}
  .more-menu .mm-sep{height:1px;background:var(--line);margin:5px 4px}
  .more-menu .mm-lbl{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:3px 12px 2px}
  .btn{
    border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:6px 12px;border-radius:6px;
    font-size:13px;cursor:pointer;line-height:1.2;transition:.12s;white-space:nowrap;
  }
  .btn:hover{border-color:var(--panel-edge);background:var(--sel)}
  .btn.primary{background:var(--hero);border-color:var(--hero);color:#fff}
  .btn.primary:hover{background:#0069d9;border-color:#0069d9}
  .btn:active{transform:translateY(1px)}
  /* ===== 레이아웃 ===== */
  .shell{display:flex;height:calc(100% - 54px)}
  .side{
    width:288px;flex:none;background:var(--panel);border-right:1px solid var(--panel-edge);
    overflow-y:auto;padding:16px 14px 60px;
  }
  .main{flex:1;overflow-y:auto}
  .main-inner{max-width:820px;margin:0 auto;padding:38px 46px 120px}
  /* ===== 사이드: 검색 ===== */
  .search{position:relative;margin-bottom:16px}
  .search input{
    width:100%;padding:9px 11px 9px 32px;border:1px solid var(--panel-edge);border-radius:6px;
    background:var(--paper);font-size:13.5px;color:var(--ink);
  }
  .search input:focus{outline:none;border-color:var(--rubric);background:var(--surface)}
  .search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--muted)}
  .side-head{
    display:flex;align-items:center;justify-content:space-between;
    font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);
    font-weight:700;margin:18px 2px 8px;
  }
  .side-head button{border:0;background:none;color:var(--rubric);font-size:11px;cursor:pointer;letter-spacing:.04em;padding:2px 4px;border-radius:4px}
  .side-head button:hover{background:var(--sel)}
  .side-head[data-sechead]{cursor:pointer}
  .side-head[data-sechead]>span:nth-child(2){flex:1}
  .side-head .sh-tw{font-size:9px;color:var(--muted);transition:transform .12s;width:11px;display:inline-block}
  .side-head.collapsed .sh-tw{transform:rotate(-90deg)}
  .side-sec.collapsed{display:none}
  /* 태그 트리 */
  .tag-tree{list-style:none;margin:0;padding:0;font-size:13.5px}
  .tag-row{display:flex;align-items:center;gap:4px;padding:4px 7px;border-radius:6px;cursor:pointer;color:var(--ink)}
  .tag-row:hover{background:var(--sel)}
  .tag-row.active{background:var(--celadon);color:var(--ink)}
  .tag-row.active .count{color:#2d5a86}
  .tag-row .twirl{width:14px;flex:none;text-align:center;color:var(--muted);font-size:10px;transition:.12s}
  .tag-row .twirl[data-twirl]{cursor:pointer;border-radius:3px}
  .tag-row .twirl[data-twirl]:hover{background:var(--panel-edge);color:var(--ink)}
  .tag-row.active .twirl{color:#2d5a86}
  .tag-row .tname{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tag-row .count{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
  .tag-children{list-style:none;margin:0;padding:0 0 0 16px;border-left:1px solid var(--panel-edge);margin-left:11px}
  .tag-row.collapsed + .tag-children{display:none}
  /* 세계관 목록(전환기) */
  .world-list{list-style:none;margin:0 0 6px;padding:0;font-size:13.5px}
  .world-row{display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:6px;cursor:pointer;color:var(--ink)}
  .world-row:hover{background:var(--sel)}
  .world-row.active{background:var(--celadon);font-weight:600}
  .world-row .wname{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .world-row .count{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
  .world-add{width:100%;text-align:left;border:1px dashed var(--panel-edge);background:var(--paper);color:var(--rubric);
    border-radius:6px;padding:7px 9px;font-size:13px;cursor:pointer;margin-bottom:4px}
  .world-add:hover{background:#eef4fa;border-color:var(--rubric-soft)}
  /* 색인(글자별) */
  .idx-group{margin-bottom:4px}
  .idx-letter{font-size:11px;font-weight:700;color:var(--rubric);letter-spacing:.06em;padding:6px 7px 2px;}
  .idx-item{display:block;padding:4px 7px 4px 16px;border-radius:6px;font-size:13.5px;color:var(--ink);
    cursor:pointer;text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .idx-item:hover{background:var(--sel)}
  .idx-item.active{background:var(--celadon);color:var(--ink)}
  .idx-empty{color:var(--muted);font-size:12.5px;padding:6px 8px}
  /* ===== 본문(읽기) ===== */
  .eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--rubric);font-weight:700;margin-bottom:8px}
  .idx-ns{color:var(--muted);font-size:.9em}
  .ns-badge{display:inline-block;background:var(--celadon);color:var(--rubric);border-radius:4px;padding:1px 7px;margin-right:8px;font-size:11px;letter-spacing:.06em;vertical-align:middle}
  /* 경로(breadcrumb) */
  .crumb{font-size:12.5px;color:var(--muted);margin-bottom:6px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .crumb-lead{color:var(--rubric-soft)} .crumb-sep{color:var(--muted);opacity:.6}
  .crumb a{color:var(--rubric);cursor:pointer} .crumb-ns{color:var(--rubric);font-weight:600}
  /* 머리말 */
  .headnote{font-size:13.5px;color:var(--muted);font-style:italic;border-left:3px solid var(--celadon);padding:2px 0 2px 12px;margin:0 0 14px}
  /* 서적 문서 */
  .book-band{display:flex;flex-wrap:wrap;gap:4px 16px;align-items:baseline;margin:0 0 14px;padding:9px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);font-family:var(--serif,'바탕',Batang,serif)}
  .book-by{font-size:14px;color:var(--ink)} .book-desc{font-size:13px;color:var(--muted)}
  .article.book-body{font-family:'바탕',Batang,'Apple SD Gothic Neo',serif;line-height:1.95}
  .article.book-body p{text-indent:1em;margin:.3em 0}
  .book-nav{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0 4px;padding-top:12px;border-top:1px solid var(--line);font-size:13px}
  .book-nav .bn-a{color:var(--rubric);cursor:pointer} .book-nav .bn-x{color:var(--muted);opacity:.5}
  /* 내비 상자 */
  .navbox{border:1px solid var(--line);border-radius:0;margin:18px 0 0;background:var(--surface);font-size:13px;overflow:hidden}
  .navbox>summary{cursor:pointer;padding:8px 13px;font-weight:700;background:var(--panel);text-align:center;list-style:none}
  .navbox>summary::-webkit-details-marker{display:none}
  .nbx-body{padding:4px 12px 10px}
  .nbx-group{display:flex;gap:8px;padding:5px 0;border-top:1px solid var(--panel-edge);align-items:baseline}
  .nbx-group:first-child{border-top:0}
  .nbx-label{flex:0 0 22%;font-weight:600;color:var(--muted);font-size:12px}
  .nbx-items{flex:1;display:flex;flex-wrap:wrap;gap:3px 10px}
  .nbx-item{color:var(--rubric);cursor:pointer} .nbx-item.new{color:var(--rubric-soft)}
  /* 분류 줄(문서 하단) */
  .cat-line{margin-top:26px;padding-top:12px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;align-items:center;gap:7px;font-size:12.5px}
  .cat-line .cl-lbl{color:var(--muted);font-weight:700}
  .cat-chip{background:var(--sel);color:var(--rubric);border-radius:5px;padding:2px 9px;cursor:pointer}
  .cat-chip .count{color:var(--muted);font-size:11px}
  /* 분류 문서(category page) */
  .cat-count{color:var(--muted);font-size:13px;margin-bottom:16px}
  .cat-sub,.cat-books,.cat-docs{margin:18px 0}
  .cat-sub h4,.cat-books h4,.cat-docs h4{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 9px}
  .cat-sub{display:flex;flex-direction:column;gap:9px} .cat-sub h4{margin-bottom:0}
  .cat-grp{margin-bottom:10px} .cat-letter{font-weight:700;color:var(--rubric);font-size:13px;border-bottom:1px solid var(--line);padding-bottom:3px;margin-bottom:5px}
  .cat-doc{display:inline-block;margin:2px 14px 2px 0;color:var(--rubric);cursor:pointer}
  .cat-book{display:block;margin:4px 0;color:var(--ink);cursor:pointer} .cat-book b{color:var(--rubric)} .bk-by,.bk-desc{color:var(--muted);font-size:13px}
  /* 편집기 문서 설정 패널 */
  .ds-panel{margin-top:10px;border-top:1px solid var(--line);padding-top:4px}
  .ds-panel>summary{cursor:pointer;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:8px 2px;list-style:none}
  .ds-panel>summary::-webkit-details-marker{display:none} .ds-panel>summary::before{content:"▸ "}
  .ds-panel[open]>summary::before{content:"▾ "}
  .ds-body{padding:4px 2px 2px}
  .ds-row{display:flex;align-items:center;gap:10px;margin:6px 0} .ds-row>label{flex:0 0 96px;font-size:12px;color:var(--muted);text-align:right}
  .ds-row>input{flex:1;padding:6px 9px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);font-family:inherit;font-size:13.5px}
  .ds-check{display:flex;align-items:center;gap:7px;font-size:13px;margin:6px 0}
  #dsBookFields input{width:100%;padding:6px 9px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);font-family:inherit;font-size:13.5px}
  .ds-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px} .ds-grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
  .ds-checks{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:4px}
  /* 단계별 설명(투어) */
  .tour .tour-step{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--rubric);font-weight:700}
  .tour .tour-body{font-size:14px;line-height:1.7;color:var(--ink)}
  .tour .tour-body code{font-family:var(--mono);font-size:.9em;background:var(--sel);padding:1px 5px;border-radius:4px}
  .tour .tour-dots{display:flex;gap:6px;justify-content:center;margin-top:16px}
  .tour .tour-dot{width:7px;height:7px;border-radius:50%;background:var(--panel-edge)}
  /* ===== 통계표 ===== */
  #stw{position:fixed;top:54px;left:0;right:0;bottom:0;z-index:10;display:flex;background:var(--paper)}
  #stw .st-panel{width:264px;min-width:230px;height:100%;overflow-y:auto;background:var(--panel);border-right:1px solid var(--line);padding:14px 14px 40px}
  #stw .st-sec{margin-bottom:18px}
  #stw .st-h{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:8px}
  #stw .st-list{display:flex;flex-direction:column;gap:5px;max-height:34vh;overflow:auto}
  #stw .st-cols{max-height:40vh}
  #stw .st-chk{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--ink);cursor:pointer}
  #stw .st-dim{color:var(--muted);font-size:11px}
  #stw .st-sel{width:100%;height:30px;border:1px solid var(--line);border-radius:0;background:var(--surface);color:var(--ink);font-family:inherit;font-size:13px;padding:0 6px}
  #stw .st-stage{flex:1;min-width:0;height:100%;display:flex;flex-direction:column}
  #stw .st-toolbar{height:46px;min-height:46px;border-bottom:1px solid var(--line);background:var(--paper);display:flex;align-items:center;gap:8px;padding:0 16px}
  #stw .st-toolbar .sp{flex:1}
  #stw .st-title{font-weight:700;font-size:14px}
  #stw .st-scroll{flex:1;overflow:auto;padding:20px}
  .st-table{border-collapse:collapse;font-size:13px;background:var(--surface);white-space:nowrap}
  .st-table th,.st-table td{border:1px solid var(--line);padding:5px 10px;text-align:left;vertical-align:top}
  .st-table thead th{background:var(--panel);font-weight:700;position:sticky;top:0;z-index:1}
  .st-table .st-name{font-weight:600}
  .st-table .st-name a{color:var(--rubric);cursor:pointer}
  .st-table .st-small{font-size:11.5px}
  .st-table .st-blank{color:var(--panel-edge)}
  .st-table tr.st-grp td{background:var(--sel);font-weight:700;color:var(--rubric);cursor:pointer;position:sticky;left:0}
  .st-table tr.st-grp .st-tw{display:inline-block;width:12px}
  .st-table .st-empty{color:var(--muted);text-align:center;padding:30px}
  .st-export .st-cap{font-weight:700;font-size:16px;margin-bottom:12px}
  .st-export .st-table tr.st-grp td{position:static}
  .st-export .st-table thead th{position:static}
  @media(max-width:760px){ #stw{flex-direction:column;overflow:auto;position:static;height:auto;min-height:80vh}
    #stw .st-panel{width:100%;height:auto;border-right:0;border-bottom:1px solid var(--line)}
    #stw .st-stage{min-height:60vh} }
  .tour .tour-dot.on{background:var(--rubric)}
  .doc-title{font-size:33px;line-height:1.18;font-weight:680;letter-spacing:-.018em;margin:0 0 10px}
  .doc-tags{display:flex;flex-wrap:wrap;gap:4px 14px;margin:0 0 18px;padding-bottom:18px;border-bottom:1px solid var(--line)}
  .chip{font-size:12.5px;color:var(--ochre);background:transparent;border:0;border-radius:0;padding:0;cursor:pointer}
  .chip:hover{text-decoration:underline}
  .chip .par{color:var(--muted)}
  /* 목차 */
  .toc{background:var(--panel);border:1px solid var(--panel-edge);border-radius:0;
    padding:14px 18px;margin:0 0 26px;max-width:340px}
  .toc h4{margin:0 0 8px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:700}
  .toc ol{list-style:none;margin:0;padding:0;counter-reset:t;font-size:13.5px}
  .toc li{counter-increment:t;padding:2px 0}
  .toc li.lv3{padding-left:18px}
  .toc a{color:var(--ink);text-decoration:none;cursor:pointer}
  .toc a:hover{color:var(--rubric);text-decoration:underline}
  .toc a::before{content:counters(t,".") "  ";color:var(--rubric);font-variant-numeric:tabular-nums}
  .toc li.lv3 a::before{content:""}
  /* 본문 타이포 */
  .article{font-size:15.5px}
  .article h2{font-size:22px;font-weight:660;letter-spacing:-.01em;margin:34px 0 12px;padding-bottom:6px;border-bottom:1px solid var(--line);scroll-margin-top:64px}
  .article h3{font-size:17px;font-weight:660;margin:24px 0 8px;scroll-margin-top:64px}
  /* 소제목 단위 접기 */
  .article h2.sec-head,.article h3.sec-head{cursor:pointer;position:relative;padding-left:20px}
  .article h2.sec-head{padding-left:20px}
  .article .sec-head::before{content:"▾";position:absolute;left:0;top:.12em;color:var(--rubric-soft);font-size:.62em;transition:transform .12s}
  .article h3.sec-head::before{top:.2em}
  .article .sec-head.sec-collapsed::before{transform:rotate(-90deg)}
  .article .sec-head:hover::before{color:var(--rubric)}
  .article .sec-hidden{display:none!important}
  .article p{margin:0 0 14px}
  .article ul,.article ol{margin:0 0 14px;padding-left:24px}
  .article li{margin:3px 0}
  .article blockquote{margin:0 0 16px;padding:6px 16px;border-left:3px solid var(--rubric);background:color-mix(in srgb,var(--rubric) 8%,var(--surface));color:var(--ink);border-radius:0;overflow:hidden}
  .article hr{border:0;border-top:1px solid var(--line);margin:26px 0}
  .article code{font-family:var(--mono);font-size:.88em;background:var(--sel);padding:1px 5px;border-radius:4px}
  .article img{max-width:100%;border:1px solid var(--line);border-radius:6px;display:block;margin:6px 0 4px}
  .figure{margin:0 0 18px}
  /* 표 */
  .table-wrap{overflow-x:auto;margin:0 0 18px;-webkit-overflow-scrolling:touch}
  .wtable{border-collapse:collapse;width:100%;font-size:14.5px;background:var(--surface);border:1px solid var(--panel-edge)}
  .wtable th,.wtable td{border:1px solid var(--line);padding:7px 12px;text-align:left;vertical-align:top}
  .wtable thead th{background:var(--panel);font-weight:650;color:var(--ink);white-space:nowrap}
  .wtable tbody tr:nth-child(even){background:var(--sel)}
  .wtable tbody tr:hover{background:var(--celadon)}
  .figure figcaption{font-size:12.5px;color:var(--muted);margin-top:5px;text-align:center}
  .article a.ext{color:var(--rubric);text-decoration:underline;text-underline-offset:2px}
  /* 위키 링크 — 루브리케이션 */
  a.wlink{color:var(--rubric);text-decoration:none;border-bottom:1px solid #a8c8e6;cursor:pointer;font-weight:500}
  a.wlink:hover{background:#e3edf5;border-bottom-color:var(--rubric)}
  a.wlink.new{color:var(--rubric-soft);border-bottom:1px dashed var(--rubric-soft)}
  a.wlink.new:hover{background:#e8f1fa}
  /* 역링크 */
  .backlinks{margin-top:46px;padding-top:18px;border-top:1px solid var(--line)}
  .backlinks h4{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:0 0 8px}
  .backlinks a{display:inline-block;margin:0 12px 6px 0;color:var(--rubric);cursor:pointer;font-size:13.5px;border-bottom:1px solid #a8c8e6}
  .backlinks .none{color:var(--muted);font-size:13px}
  /* ===== 편집기 ===== */
  .editor{display:flex;flex-direction:column;gap:14px}
  .editor input.title-in{font-size:26px;font-weight:660;border:0;border-bottom:2px solid var(--line);
    padding:6px 2px;background:transparent;color:var(--ink);letter-spacing:-.01em}
  .editor input.title-in:focus{outline:none;border-bottom-color:var(--rubric)}
  .tag-edit{padding:4px 2px 2px}
  .tag-edit .lbl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:8px}
  .tag-pick{display:flex;flex-wrap:wrap;gap:6px}
  .tag-pick label{display:inline-flex;align-items:center;gap:5px;font-size:13px;border:1px solid var(--line);
    border-radius:20px;padding:3px 11px;cursor:pointer;background:var(--surface);user-select:none}
  .tag-pick label.on{background:#dcece7;border-color:#bfdcd3;color:var(--ochre)}
  .tag-pick label .sub{color:var(--muted);font-size:11px}
  .tag-pick input{display:none}
  .editor textarea{
    width:100%;min-height:440px;resize:vertical;border:1px solid var(--line);border-radius:var(--radius);
    padding:16px 18px;font-family:var(--mono);font-size:14px;line-height:1.7;background:var(--paper);color:var(--ink);
  }
  .editor textarea:focus{outline:none;border-color:var(--rubric);background:var(--surface)}
  .helpbar{font-size:12px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap;align-items:center}
  .helpbar code{font-family:var(--mono);background:var(--sel);padding:1px 5px;border-radius:4px;color:var(--ink)}
  .img-tray{border-top:1px solid var(--line);padding:14px 2px 2px;margin-top:4px}
  .img-grid{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
  .img-card{width:104px;font-size:11px;color:var(--muted)}
  .img-card img{width:104px;height:78px;object-fit:cover;border:1px solid var(--line);border-radius:0;display:block}
  .img-card .nm{margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .img-card .row{display:flex;gap:4px;margin-top:3px}
  .img-card .mini{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:4px;font-size:10.5px;padding:2px 0;cursor:pointer}
  .img-card .mini:hover{background:var(--sel)}
  .edit-actions{display:flex;gap:8px;justify-content:flex-end}
  /* 빈 화면 */
  .empty{color:var(--muted);text-align:center;padding:80px 20px}
  .empty .big{font-size:40px;color:var(--rubric);margin-bottom:10px}
  /* 모달 */
  .modal-bg{position:fixed;inset:0;background:rgba(31,29,27,.4);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
  .modal{background:var(--paper);border-radius:10px;max-width:440px;width:100%;padding:24px;box-shadow:0 18px 50px rgba(0,0,0,.25)}
  .modal h3{margin:0 0 4px;font-size:18px}
  .modal p{margin:0 0 16px;color:var(--muted);font-size:13.5px}
  .modal label.fld{display:block;font-size:12px;color:var(--muted);margin:0 0 5px;font-weight:600}
  .modal input,.modal select{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:6px;background:var(--surface);font-size:14px;margin-bottom:14px}
  .modal .row{display:flex;gap:8px;justify-content:flex-end}
  .tag-manage-list{max-height:240px;overflow:auto;border:1px solid var(--line);border-radius:6px;margin-bottom:14px}
  .sync-status{font-size:12.5px;color:var(--muted);margin:2px 0 16px;padding:8px 11px;background:var(--panel);border-radius:6px}
  .modal .warn{background:var(--surface)4e5;border:1px solid #f0d9a8;color:#7a5a12;padding:9px 11px;border-radius:7px;font-size:12.5px;margin-bottom:14px;line-height:1.55}
  .modal ol code,.modal p code{font-family:var(--mono);background:#e7edf2;padding:1px 5px;border-radius:4px;font-size:.86em}
  .tm-row{display:flex;align-items:center;gap:8px;padding:6px 10px;border-bottom:1px solid var(--line);font-size:13.5px}
  .tm-row:last-child{border-bottom:0}
  .tm-row.child{padding-left:26px;background:var(--paper)}
  .tm-row .tm-name{flex:1}
  .tm-row .tm-del{border:0;background:none;color:var(--rubric-soft);cursor:pointer;font-size:12px}
  .tm-row .tm-del:hover{color:var(--rubric)}
  /* 토스트 */
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;
    padding:10px 18px;border-radius:8px;font-size:13.5px;z-index:80;opacity:0;transition:.25s;pointer-events:none}
  .toast.show{opacity:1}
  /* 메뉴 토글(모바일) */
  .menu-toggle{display:none;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 10px;cursor:pointer;font-size:16px;line-height:1}
  .actions-menu-btn{display:none!important}
  .side-backdrop{display:none}
  @media(max-width:760px){
    .side{position:fixed;left:0;top:54px;bottom:0;width:84vw;max-width:320px;z-index:30;transform:translateX(-100%);transition:transform .2s;box-shadow:2px 0 24px rgba(0,0,0,.18)}
    .side.open{transform:none}
    .menu-toggle{display:inline-flex}
    .main-inner{padding:22px 16px 110px}
    .doc-title{font-size:26px}
    .brand .worldname{max-width:34vw}
    .topbar{gap:6px;padding:0 10px}
    .actions{gap:5px}
    .actions .btn{padding:6px 9px;font-size:13px}

    /* 사이드 서랍 백드롭 */
    .side-backdrop{position:fixed;inset:54px 0 0 0;background:rgba(32,40,32,.30);z-index:25}
    .side-backdrop.show{display:block}

    /* iOS 입력 확대 방지 + 편집 화면 손가락 친화 */
    .search input,.editor textarea,.editor input.title-in,.modal input,.modal select{font-size:16px}
    .editor textarea{min-height:300px}
    .edit-actions{flex-wrap:wrap}
    .edit-actions .btn{flex:1;min-width:88px;text-align:center}
    #edDelete{flex-basis:100%;margin-right:0!important;order:3}
    .tag-pick label{padding:7px 13px}
  }
  /* ===== 인쇄(PDF) ===== */
  @media print{
    .topbar,.side,.toc-skip,.edit-actions,.menu-toggle,.actions-menu-btn,.side-backdrop{display:none!important}
    .backlinks{display:none}
    .shell{display:block;height:auto}
    .main{overflow:visible}
    .main-inner{max-width:none;padding:0}
    body{background:#fff;font-size:12pt}
    a.wlink{color:var(--ink);border-bottom:0}
    .article a.ext{color:var(--ink)}
    .doc-title{font-size:26pt}
    .toc{break-inside:avoid}
    .article h2,.article h3{break-after:avoid}
    .figure,.article img{break-inside:avoid}
  }
  /* ===== 감상용(읽기 전용) 잠금 ===== */
  .ro-badge{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--rubric);
    background:var(--celadon);border:1px solid #9cc4ea;padding:6px 13px;border-radius:6px;font-weight:700}
  body.locked, body.locked *{-webkit-user-select:none;-moz-user-select:none;user-select:none}
  body.locked .search input{-webkit-user-select:text;user-select:text}
  body.locked img{-webkit-user-drag:none;user-drag:none}
  :focus-visible{outline:2px solid var(--rubric);outline-offset:2px}
  @media(prefers-reduced-motion:reduce){*{transition:none!important}}
  /* ================= WYSIWYG 편집기 ================= */
  /* 리본형 평면 툴바 — 박스 없이, 얇은 구분선과 여백으로 */
  .wy-toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:3px 2px;padding:7px 4px;
    background:transparent;border:0;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:4}
  .wy-grp{display:flex;gap:2px;align-items:center;padding:0 7px;position:relative}
  .wy-grp:not(:last-child)::after{content:"";position:absolute;right:0;top:5px;bottom:5px;width:1px;background:var(--panel-edge);opacity:.7}
  .wy-b{min-width:29px;height:29px;padding:0 6px;border:0;background:transparent;border-radius:6px;
    cursor:pointer;font-size:13px;color:var(--ink);font-family:inherit;line-height:1;transition:background .12s}
  .wy-b:hover{background:var(--sel)}
  .wy-b:active{background:var(--celadon)}
  .wy-b svg{display:block;width:15px;height:15px}
  .wy-block,.wy-sel{height:29px;border:1px solid transparent;border-radius:6px;background:transparent;font-family:inherit;
    font-size:12.5px;color:var(--ink);padding:0 4px;max-width:106px;cursor:pointer}
  .wy-block:hover,.wy-sel:hover{background:var(--sel)}
  .wy-block:focus,.wy-sel:focus{outline:none;border-color:var(--line);background:var(--surface)}
  .wy-sel.wy-size{max-width:52px}
  .wy-tag{font-size:10.5px;color:var(--muted);font-weight:700;align-self:center;padding-right:1px}
  .wy-grad{display:inline-flex;align-items:center;gap:2px;font-size:10px;color:var(--muted);padding:0 2px}
  .wy-grad input[type=color]{width:18px;height:20px;padding:0;border:1px solid var(--line);border-radius:4px;cursor:pointer}
  .wy-grad .wy-b{min-width:20px;height:20px;padding:0}
  .wy-color{display:inline-flex;align-items:center;justify-content:center;width:29px;height:29px;border:0;border-radius:6px;cursor:pointer;position:relative;font-weight:700;font-size:13px;background:transparent}
  .wy-color:hover{background:var(--sel)}
  .wy-color.wy-hl span{background:var(--surface)3a3;padding:0 2px;border-radius:2px}
  .wy-color input[type=color]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;border:0;padding:0}
  .wy-tbl{flex-wrap:wrap}
  /* 페이지 색 컨트롤 */
  .pg-ctl{display:flex;align-items:center;gap:6px;padding:4px 2px 2px}
  .pg-lbl{font-size:10.5px;color:var(--muted);font-weight:700}
  .pg-color{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border:1px solid var(--line);border-radius:6px;cursor:pointer;position:relative;font-size:12px;background:var(--surface)}
  .pg-color input[type=color]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;border:0;padding:0}
  /* 쓰는 면 = 종이 */
  .wy-body{border:0;border-radius:10px;margin:14px auto 0;max-width:820px;width:100%;
    padding:40px 46px;min-height:420px;background:var(--surface);box-shadow:0 1px 3px rgba(20,40,70,.06),0 8px 30px rgba(20,40,70,.06);
    font-size:15.5px;line-height:1.85;color:var(--ink);outline:none}
  .wy-body:focus{box-shadow:0 1px 3px rgba(20,40,70,.08),0 8px 34px rgba(12,99,189,.12)}
  .wy-body>*:first-child{margin-top:0}
  .wy-body h2{font-size:1.4em;margin:1.1em 0 .4em;font-weight:680}
  .wy-body h3{font-size:1.18em;margin:1em 0 .35em;font-weight:660}
  .wy-body p{margin:.5em 0}
  .wy-body ul,.wy-body ol{margin:.5em 0;padding-left:1.6em}
  .wy-body blockquote{margin:.7em 0;padding:.3em 0 .3em 14px;border-left:3px solid var(--celadon);color:var(--muted)}
  .wy-body hr{border:0;border-top:1px solid var(--line);margin:1.2em 0}
  .wy-body code{font-family:var(--mono);font-size:.88em;background:var(--sel);padding:1px 5px;border-radius:4px}
  .wy-body img{max-width:100%;border-radius:6px;margin:.3em 0}
  .wy-body a.wlink{color:var(--rubric);border-bottom:1px solid var(--rubric-soft);cursor:text}
  .wy-body a.wlink.new{color:var(--rubric-soft)}
  .wy-body a.ext{color:var(--rubric);text-decoration:underline}
  .wy-body table.wtable{border-collapse:collapse;margin:.6em 0;width:auto}
  .wy-body table.wtable th,.wy-body table.wtable td{border:1px solid var(--line);padding:5px 9px;min-width:40px}
  .wy-body table.wtable th{background:var(--panel);font-weight:600}
  .article mark,.wy-body mark{background:var(--surface)3a3;padding:0 2px;border-radius:2px}
  .wy-body sup.fn{color:var(--rubric);font-weight:700;cursor:pointer;font-size:.7em}
  /* 각주(아래로 연결) */
  .article sup.fn a,.wy-body sup.fn{color:var(--rubric);text-decoration:none;font-weight:700}
  .footnotes{margin-top:30px;padding-top:14px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
  .footnotes h4{margin:0 0 8px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .fn-item{margin:4px 0;line-height:1.6}
  .fn-item a.fn-back{color:var(--rubric);font-weight:700;margin-right:5px;cursor:pointer;text-decoration:none}
  /* 주석 팝업(클릭 시 그 자리에서) */
  .fn-pop{position:fixed;z-index:90;max-width:300px;background:var(--surface);color:var(--ink);
    border:1px solid var(--line);box-shadow:0 10px 34px rgba(20,40,70,.22);padding:10px 12px;font-size:13px;line-height:1.6}
  .fn-pop .fn-pop-n{color:var(--rubric);font-weight:700;margin-right:5px}
  .fn-pop .fn-pop-go{display:block;margin-top:8px;font-size:11.5px;color:var(--rubric);cursor:pointer;text-decoration:none}
  /* 경고/스포일러 상자(callout) */
  .article .callout,.wy-body .callout{border:1px solid var(--line);border-left-width:4px;border-radius:0;padding:11px 14px;margin:1em 0;background:var(--surface);font-size:.97em}
  .article .callout>*:first-child,.wy-body .callout>*:first-child{margin-top:0}
  .article .callout>*:last-child,.wy-body .callout>*:last-child{margin-bottom:0}
  .callout[data-cl="spoiler"]{border-left-color:#c0392b;background:color-mix(in srgb,#c0392b 7%,var(--surface))}
  .callout[data-cl="warn"]{border-left-color:#c77d14;background:color-mix(in srgb,#c77d14 8%,var(--surface))}
  .callout[data-cl="info"]{border-left-color:var(--rubric);background:color-mix(in srgb,var(--rubric) 7%,var(--surface))}
  .callout[data-cl="tip"]{border-left-color:#2f7d4f;background:color-mix(in srgb,#2f7d4f 7%,var(--surface))}
  .callout[data-cl="stub"]{border-left-color:#7a7f87;background:color-mix(in srgb,#7a7f87 7%,var(--surface))}
  .callout[data-cl="cleanup"]{border-left-color:#1f7a8c;background:color-mix(in srgb,#1f7a8c 7%,var(--surface))}
  .callout[data-cl="source"]{border-left-color:#b8860b;background:color-mix(in srgb,#b8860b 7%,var(--surface))}
  .callout[data-cl="disambig"]{border-left-color:#4a5568;background:color-mix(in srgb,#4a5568 7%,var(--surface))}
  .callout[data-cl="noncanon"]{border-left-color:#7a3b9b;background:color-mix(in srgb,#7a3b9b 7%,var(--surface))}
  .callout[data-cl="uncertain"]{border-left-color:#5a6b86;background:color-mix(in srgb,#5a6b86 7%,var(--surface))}
  /* 스포일러(가림 → 클릭하면 보임) */
  .article .spoiler{background:var(--ink);color:transparent;border-radius:3px;cursor:pointer;transition:color .12s;padding:0 2px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
  .article .spoiler *{color:transparent!important}
  .article .spoiler.revealed{background:color-mix(in srgb,var(--ink) 9%,var(--surface));color:inherit}
  .article .spoiler.revealed *{color:inherit!important}
  .wy-body .spoiler{background:color-mix(in srgb,var(--ink) 12%,var(--surface));border-bottom:2px dotted var(--muted);border-radius:3px;padding:0 2px}
  /* 접기(details) — 나무위키식 */
  .article details.fold,.wy-body details.fold{border:1px solid var(--line);border-radius:0;margin:1em 0;background:var(--surface);overflow:hidden}
  .article details.fold>summary,.wy-body details.fold>summary{cursor:pointer;padding:9px 13px;font-weight:600;background:var(--panel);list-style:none;user-select:none;display:flex;align-items:center;gap:7px}
  details.fold>summary::-webkit-details-marker{display:none}
  details.fold>summary::before{content:"▸";color:var(--rubric);transition:transform .15s;display:inline-block}
  details.fold[open]>summary::before{transform:rotate(90deg)}
  .article details.fold>*:not(summary),.wy-body details.fold>*:not(summary){padding:0 14px}
  .article details.fold>summary ~ *,.wy-body details.fold>summary ~ *{margin:.6em 0}
  .wy-page{transition:background .2s}
  /* 내 폰트 매니저 */
  .fm-list{display:flex;flex-direction:column;gap:6px;max-height:44vh;overflow:auto}
  .fm-row{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:8px}
  .fm-name{font-weight:600;font-size:14px;min-width:90px}
  .fm-prev{flex:1;color:var(--muted);font-size:15px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
  /* 위키 색상 테마 */
  .thm-grid{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
  .thm-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 11px;border:1px solid var(--line);border-radius:8px}
  .thm-row span{font-size:13.5px;font-weight:600}
  .thm-row small{font-weight:400;color:var(--muted);font-size:11.5px;margin-left:4px}
  .thm-row input[type=color]{width:46px;height:28px;padding:0;border:1px solid var(--line);border-radius:6px;cursor:pointer;background:var(--surface,#fff)}
  .thm-presets-lbl{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:7px}
  .thm-presets{display:flex;flex-wrap:wrap;gap:6px}
  @media(max-width:760px){ .wy-body{padding:20px 15px;font-size:16px;border-radius:8px} .wy-toolbar{position:static} }
  /* ================= 인포박스(정보 틀) ================= */
  .ib{float:right;width:300px;max-width:42%;margin:4px 0 18px 24px;border:1px solid var(--line);
    border-radius:0;overflow:hidden;background:var(--surface);box-shadow:0 1px 10px rgba(20,40,70,.06);font-size:13px}
  .ib-title{background:var(--ib-accent,var(--rubric));color:#fff;font-weight:700;text-align:center;
    padding:9px 12px;font-size:14.5px;line-height:1.35;word-break:keep-all}
  .ib-img{padding:12px 12px 4px;text-align:center}
  .ib-img img{max-width:100%;border-radius:6px;display:inline-block}
  .ib-sec{background:color-mix(in srgb,var(--ib-accent,var(--rubric)) 14%,var(--surface));
    color:var(--ib-accent,var(--rubric));font-weight:700;text-align:center;padding:5px 10px;font-size:12px;
    letter-spacing:.02em;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
  .ib-badge{text-align:center;font-weight:800;font-size:15px;color:var(--ib-accent,var(--rubric));padding:8px 10px 2px;letter-spacing:.02em}
  .ib-row{display:flex;border-top:1px solid var(--panel-edge)}
  .ib-row:first-of-type{border-top:0}
  .ib-k{flex:0 0 33%;background:var(--panel);color:var(--muted);font-weight:600;padding:6px 9px;font-size:12px;word-break:keep-all}
  .ib-v{flex:1;padding:6px 10px;min-width:0;word-break:break-word;line-height:1.5}
  .ib-v img{max-width:100%;border-radius:4px}
  .ib-note{padding:7px 11px;font-size:11px;color:var(--muted);line-height:1.5;border-top:1px solid var(--line);background:var(--paper)}
  /* 편집기 인포박스 패널 */
  .ib-panel{margin-top:10px;padding:14px 2px 2px;border-top:1px solid var(--line)}
  .ib-panel-top{display:flex;gap:8px;margin:7px 0 2px}
  .ib-panel-top select{flex:1;padding:7px 9px;border:1px solid var(--line);border-radius:7px;font-family:inherit;font-size:14px;background:var(--surface);color:var(--ink)}
  .ib-fields{margin-top:4px}
  .ib-title-in{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:7px;font-family:inherit;font-size:14px;margin:8px 0;background:var(--surface);color:var(--ink)}
  .ib-edit-sec{font-weight:700;font-size:11.5px;color:var(--rubric);text-transform:uppercase;letter-spacing:.06em;margin:12px 0 4px;padding-bottom:3px;border-bottom:1px solid var(--line)}
  .ib-edit-row{display:flex;align-items:center;gap:8px;margin:5px 0}
  .ib-edit-row.badge .ib-edit-val{font-weight:700}
  .ib-edit-lbl{flex:0 0 90px;font-size:12px;color:var(--muted);text-align:right;word-break:keep-all}
  .ib-edit-val{flex:1;padding:6px 9px;border:1px solid var(--line);border-radius:6px;font-family:inherit;font-size:14px;background:var(--surface);color:var(--ink);min-width:0}
  textarea.ib-edit-val{resize:vertical;line-height:1.4}
  .ib-edit-img{display:flex;align-items:center;gap:8px;margin:6px 0}
  .ib-edit-img img{width:54px;height:54px;object-fit:cover;border-radius:0;border:1px solid var(--line)}
  /* 틀 관리 모달 */
  .ibm-list{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;max-height:38vh;overflow:auto}
  .ibm-row{display:flex;align-items:center;gap:8px;padding:6px 8px;border:1px solid var(--line);border-radius:7px}
  .ibm-row .sw{width:14px;height:14px;border-radius:4px;flex:none}
  .ibm-row .nm{flex:1;font-weight:600;font-size:13.5px}
  .ibm-row .ct{font-size:11px;color:var(--muted)}
  .ibm-add{border-top:1px solid var(--line);padding-top:10px}
  .ibm-add .lbl{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:6px}
  .ibm-presets{display:flex;flex-wrap:wrap;gap:6px}
  .btn.mini{padding:4px 9px;font-size:12px;border-radius:6px}
  /* 틀 편집(필드 목록) */
  .ibf-list{display:flex;flex-direction:column;gap:6px;max-height:42vh;overflow:auto}
  .ibf-row{display:flex;align-items:center;gap:6px}
  .ibf-type{flex:0 0 118px;padding:6px;border:1px solid var(--line);border-radius:6px;font-family:inherit;font-size:12.5px;background:var(--surface);color:var(--ink)}
  .ibf-label{flex:1;min-width:0;padding:6px 8px;border:1px solid var(--line);border-radius:6px;font-family:inherit;font-size:13.5px;background:var(--surface);color:var(--ink)}
  .ibf-mv,.ibf-del{border:1px solid var(--line);background:var(--surface);border-radius:6px;cursor:pointer;width:28px;height:30px;color:var(--muted);flex:none}
  .ibf-del{color:var(--rubric);font-size:16px;line-height:1}
  .ibf-mv:hover,.ibf-del:hover{background:var(--sel)}
  @media(max-width:760px){
    .ib{float:none;width:100%;max-width:none;margin:0 0 16px}
    .ib-edit-lbl{flex-basis:72px}
    .ibf-type{flex-basis:104px}
  }
  /* ================= 연표(timeline) 통합 — 전부 #tlw 아래로 스코프 ================= */
  #tlw{--tlacc:var(--rubric);--tlacc-soft:var(--celadon);--tldng:#9b3b3b;
    position:fixed;top:54px;left:0;right:0;bottom:0;z-index:10;
    display:flex;width:100%;font-size:13px;color:var(--ink);background:var(--paper);overflow:hidden}
  #tlw .tl-panel{width:330px;min-width:288px;height:100%;overflow-y:auto;background:var(--panel);
    border-right:1px solid var(--line);padding:0 0 70px}
  #tlw .tl-switch{padding:12px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:5}
  #tlw .tl-switch .lbl{font-size:11px;letter-spacing:.06em;color:var(--muted);font-weight:700;margin-bottom:6px;text-transform:uppercase}
  #tlw .tl-switch .row2{display:flex;gap:6px;margin-top:7px}
  #tlw details.sec{border-bottom:1px solid var(--line)}
  #tlw details.sec>summary{list-style:none;cursor:pointer;padding:11px 16px;font-weight:700;font-size:11.5px;
    letter-spacing:.05em;color:var(--muted);display:flex;align-items:center;justify-content:space-between;user-select:none}
  #tlw details.sec>summary::-webkit-details-marker{display:none}
  #tlw details.sec>summary::after{content:"＋";color:var(--line);font-size:14px}
  #tlw details.sec[open]>summary::after{content:"－"}
  #tlw .sec-body{padding:4px 16px 16px}
  #tlw .field{margin-bottom:11px}
  #tlw .field>label{display:block;font-size:11px;color:var(--muted);margin-bottom:4px}
  #tlw input[type=text],#tlw textarea,#tlw select{width:100%;padding:7px 9px;border:1px solid var(--line);
    border-radius:6px;font-family:var(--sans);font-size:13px;background:var(--surface);color:var(--ink)}
  #tlw input[type=text]:focus,#tlw textarea:focus,#tlw select:focus{outline:none;border-color:var(--tlacc);box-shadow:0 0 0 3px var(--tlacc-soft)}
  #tlw textarea{resize:vertical;min-height:44px;line-height:1.4}
  #tlw input[type=number]{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:6px;font-family:var(--mono);font-size:12px}
  #tlw input[type=range]{width:100%;accent-color:var(--tlacc)}
  #tlw input[type=color]{width:34px;height:26px;padding:0;border:1px solid var(--line);border-radius:5px;background:var(--surface);cursor:pointer;flex:none}
  #tlw .trow{display:flex;gap:8px}
  #tlw .trow>*{flex:1;min-width:0}
  #tlw .val{font-family:var(--mono);font-size:11px;color:var(--muted);min-width:34px;text-align:right}
  #tlw .seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
  #tlw .seg button{flex:1;border:0;background:var(--surface);padding:7px 4px;font-size:12px;cursor:pointer;color:var(--muted);font-family:var(--sans)}
  #tlw .seg button.on{background:var(--tlacc);color:#fff;font-weight:600}
  #tlw .toggles{display:flex;flex-direction:column;gap:7px}
  #tlw .toggle{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink)}
  #tlw button.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:7px 10px;border-radius:6px;cursor:pointer;font-size:12px;font-family:var(--sans)}
  #tlw button.btn:hover{background:var(--sel)}
  #tlw button.btn.primary{background:var(--tlacc);color:#fff;border-color:var(--tlacc);font-weight:600}
  #tlw button.btn.ghost{border-style:dashed;color:var(--muted);width:100%;padding:9px}
  #tlw button.linkbtn{border:0;background:none;color:var(--tlacc);cursor:pointer;font-size:11px;padding:2px 4px;font-family:var(--sans)}
  #tlw button.linkbtn.danger{color:var(--tldng)}
  #tlw .ev{border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:10px;background:var(--surface)}
  #tlw .ev-top{display:flex;gap:8px;align-items:flex-end;margin-bottom:8px}
  #tlw .comprow{display:flex;gap:5px;flex:1;min-width:0}
  #tlw .tfield{flex:1;min-width:0}
  #tlw .tfield span{display:block;font-size:9px;color:var(--muted);text-align:center;margin-bottom:2px}
  #tlw .tfield input{width:100%;padding:6px 3px;font-family:var(--mono);font-size:12px;border:1px solid var(--line);border-radius:5px;text-align:center}
  #tlw .ev-del{color:var(--tldng);border:0;background:none;cursor:pointer;font-size:15px;line-height:1;padding:2px 4px}
  #tlw .ev-opts{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:8px}
  #tlw .mini-label{font-size:10px;color:var(--muted);margin-right:2px}
  #tlw .side-seg{display:flex;border:1px solid var(--line);border-radius:5px;overflow:hidden}
  #tlw .side-seg button{border:0;background:var(--surface);padding:4px 8px;font-size:11px;cursor:pointer;color:var(--muted)}
  #tlw .side-seg button.on{background:var(--tlacc);color:#fff}
  #tlw .off-num{width:52px}
  #tlw .off-num input{width:100%;padding:4px 6px;font-family:var(--mono);font-size:11px;border:1px solid var(--line);border-radius:5px}
  #tlw .col-wrap{display:flex;align-items:center;gap:5px}
  #tlw .mini-row{display:flex;gap:6px;align-items:center;margin-bottom:8px}
  #tlw .mini-row input[type=text]{flex:1}
  #tlw .mini-row input.num{width:96px;flex:none}
  #tlw .mini-del{color:var(--tldng);border:0;background:none;cursor:pointer;font-size:15px;padding:0 2px}
  #tlw .bg-status{font-size:11px;color:var(--muted);margin-top:6px}
  #tlw .hint{font-size:10.5px;color:var(--muted);line-height:1.55;margin-top:8px}
  #tlw .ratio-row{display:flex;align-items:center;gap:5px;margin-bottom:6px;font-size:11px;color:var(--muted)}
  #tlw .ratio-row input{width:56px;padding:4px 6px;font-family:var(--mono);font-size:11px;border:1px solid var(--line);border-radius:5px;text-align:center}
  #tlw .doclink{display:flex;align-items:center;gap:6px;font-size:11px;margin-top:8px;padding:6px 9px;background:var(--sel);border-radius:6px}
  #tlw .doclink .st{flex:1;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #tlw .doclink .st b{color:var(--rubric);font-weight:600}
  #tlw .tl-stage{flex:1;height:100%;display:flex;flex-direction:column;min-width:0}
  #tlw .tl-toolbar{height:46px;min-height:46px;border-bottom:1px solid var(--line);background:var(--paper);
    display:flex;align-items:center;gap:8px;padding:0 14px;overflow-x:auto}
  #tlw .tl-toolbar .sp{flex:1}
  #tlw .tl-toolbar .grp{display:flex;gap:6px;align-items:center}
  #tlw .tl-toolbar .divider{width:1px;height:22px;background:var(--line)}
  #tlw .canvas-wrap{flex:1;overflow:auto;padding:22px;background:var(--paper)}
  #tlw #tl-svg{display:block;margin:0 auto;background:#fff;box-shadow:0 2px 20px rgba(20,30,60,.12);border-radius:4px}
  #tlw .file-hidden{display:none}
  #tlw .footnote{padding:6px 14px;font-size:10.5px;color:var(--muted);border-top:1px solid var(--line);background:var(--paper)}
  #tlw .tl-empty{margin:auto;text-align:center;color:var(--muted);padding:60px 24px}
  #tlw .tl-ev{cursor:pointer}
  #tlw .tl-ev:hover [data-box]{stroke:var(--rubric);stroke-opacity:.9;stroke-width:1.4}
  @media(max-width:760px){
    #tlw{position:static;top:auto;left:auto;right:auto;bottom:auto;z-index:auto;
      flex-direction:column;width:100%;height:auto;min-height:70vh;overflow:visible}
    #tlw .tl-panel{width:100%;min-width:0;height:auto;overflow:visible;border-right:0;border-bottom:1px solid var(--line);padding-bottom:20px}
    #tlw .tl-switch{position:static}
    #tlw .tl-stage{min-height:52vh}
    #tlw .canvas-wrap{padding:12px;max-height:70vh}
    #tlw input[type=text],#tlw textarea,#tlw select,#tlw input[type=number]{font-size:16px}
    #tlw .tl-toolbar{height:auto;flex-wrap:wrap;row-gap:7px;padding:9px 12px}
    #tlw .tfield input{font-size:15px}
    #tlw .off-num input{font-size:15px}
  }
</style>
</head>
<body>
<div class="topbar">
  <button class="menu-toggle" id="menuToggle" aria-label="목록 열기">☰</button>
  <div class="brand">
    <input class="worldname" id="worldName" value="이름 없는 세계" aria-label="세계관 이름">
  </div>
  <button class="actions-menu-btn" id="actionsMenuBtn" aria-label="메뉴">메뉴 ▾</button>
  <div class="actions" id="topActions"></div>
</div>
<div class="side-backdrop" id="sideBackdrop"></div>

<div class="shell">
  <aside class="side" id="side"></aside>
  <main class="main"><div class="main-inner" id="view"></div></main>
</div>

<div id="modalRoot"></div>
<div class="toast" id="toast"></div>

          body:`<blockquote>그는 <a class="wlink" data-title="왕도">왕도</a>의 새벽을 가장 먼저 보는 사람이었다.</blockquote>
<p><b>로엔</b>은 <a class="wlink" data-title="왕도">왕도</a> 출신의 기사로, 여명의 기사라 불린다. 이 문서는 <b>인포박스·경로·접기·스포일러·내비 상자</b>가 함께 쓰인 예시예요.</p>

<details class="fold"><summary>자세한 전말 (펼치기)</summary><p>그는 <a class="wlink" data-title="잊힌 전쟁">잊힌 전쟁</a>에서 큰 공을 세웠으나, 그 대가로 많은 것을 잃었다.</p></details>
<div class="callout" data-cl="spoiler"><p>⚠ 아래 문단에는 결말 누설이 있습니다.</p></div>
<p>진실은 이렇다: <span class="spoiler">로엔은 왕의 숨겨진 아들이며, 그 사실을 끝까지 몰랐다.</span></p>
<h2>관계</h2>
<ul><li>소속: <a class="wlink" data-title="Lore:인물">왕실 근위대</a></li><li>스승: <a class="wlink" data-title="없는 스승">없는 스승</a> (아직 문서 없음)</li></ul>` },
        { title:"왕도", tagNames:["지명","수도권"], navbox:true,
