  function computePages(L,pageLen){
    const horiz=L.horiz,longDim=horiz?L.W:L.H;
    if(!pageLen||longDim<=pageLen)return[[0,longDim]];
    const its=L.items.slice().sort((a,b)=>a.pt-b.pt);
    if(!its.length)return[[0,longDim]];
    const pages=[];let start=0,i=0;
    while(i<its.length){
      let j=i;
      while(j<its.length&&(its[j].hi-start)<=pageLen)j++;
      if(j===i)j=i+1;
      const last=its[j-1];let end;
      if(j<its.length){const next=its[j];end=Math.min(Math.max(last.hi+8,(last.hi+next.lo)/2),start+pageLen);end=Math.max(end,last.hi+4);}
      else end=longDim;
      pages.push([start,Math.min(end,longDim)]);start=end;i=j;
    }
    return pages;
  }
  function rasterize(markup,W,H,scale,cb){
    const img=new Image();
    img.onload=()=>{const cv=document.createElement("canvas");cv.width=W*scale;cv.height=H*scale;
      const ctx=cv.getContext("2d");ctx.fillStyle="#fff";ctx.fillRect(0,0,cv.width,cv.height);ctx.drawImage(img,0,0,cv.width,cv.height);cb(cv);};
    img.onerror=()=>toast("이미지 변환 실패 — SVG로 내보내 보세요");
    img.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(markup);
  }
  function exportTLSVG(){const L=computeLayout();const url="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svgMarkup(L,{}));tlDownload(tlFname()+".svg",url);}
  function exportTLPNG(){
    const L=computeLayout(),horiz=L.horiz,longDim=horiz?L.W:L.H,scale=2,pageLen=TS.pageLen;
    if(!pageLen||longDim<=pageLen){
      rasterize(svgMarkup(L,{}),L.W,L.H,scale,cv=>{cv.toBlob(b=>{const u=URL.createObjectURL(b);tlDownload(tlFname()+".png",u);setTimeout(()=>URL.revokeObjectURL(u),5000);},"image/png");});
      return;
    }
    const pages=computePages(L,pageLen);
    rasterize(svgMarkup(L,{noTitle:true}),L.W,L.H,scale,master=>{
      pages.forEach((pg,idx)=>{setTimeout(()=>{
        const[s0,e0]=pg;const pw=horiz?(e0-s0):L.W,ph=horiz?L.H:(e0-s0);
        const cv=document.createElement("canvas");cv.width=pw*scale;cv.height=ph*scale;
        const ctx=cv.getContext("2d");ctx.fillStyle="#fff";ctx.fillRect(0,0,cv.width,cv.height);
        if(horiz)ctx.drawImage(master,s0*scale,0,pw*scale,ph*scale,0,0,pw*scale,ph*scale);
        else ctx.drawImage(master,0,s0*scale,pw*scale,ph*scale,0,0,pw*scale,ph*scale);
        if(TS.title){ctx.fillStyle=TS.textColor;ctx.font=`600 ${(TS.fontSize+7)*scale}px Georgia, serif`;ctx.fillText(TS.title,24*scale,34*scale);}
        const tag=`${idx+1} / ${pages.length}`;ctx.fillStyle="#5a616e";ctx.font=`${12*scale}px system-ui, sans-serif`;
        ctx.fillText(tag,cv.width-(14+tag.length*7)*scale,cv.height-10*scale);
        cv.toBlob(b=>{const u=URL.createObjectURL(b);tlDownload(`${tlFname()}-${idx+1}.png`,u);setTimeout(()=>URL.revokeObjectURL(u),5000);},"image/png");
      },idx*450);});
    });
  }

  /* ---- 연표 .json 내보내기/가져오기 (세계관과 별개 파일) ---- */
  function tlSaveJSON(){
    const {id,...rest}=TS; // id는 이 세계관 내부용이라 뺌
    const url="data:application/json;charset=utf-8,"+encodeURIComponent(JSON.stringify(rest));
    tlDownload(tlFname()+".timeline.json",url);
    toast("이 연표를 내보냈어요");
  }
  function tlLoadJSON(file){
    const r=new FileReader();
    r.onload=()=>{try{
      const o=JSON.parse(r.result);
      const tl=normalizeTimeline(Object.assign({id:uid()}, o));
      tl.name=tl.name||"가져온 연표";
      state.timelines.push(tl); state._curTL=tl.id;
      persist(); tlSwitchTo(tl.id); toast("연표를 가져왔어요");
    }catch(err){ toast("불러오기 실패: "+err.message); }};
    r.readAsText(file);
  }

  /* ---- 컨트롤 동기화/바인딩 ---- */
  function syncTLControls(){
    const set=(id,v)=>{const el=$("#tlw "+id); if(el) el.value=v;};
    const txt=(id,v)=>{const el=$("#tlw "+id); if(el) el.textContent=v;};
    set("#c-title",TS.title); set("#c-precision",TS.precision);
    set("#r-mo",TS.ratios.mo);set("#r-d",TS.ratios.d);set("#r-h",TS.ratios.h);set("#r-min",TS.ratios.min);
    set("#c-line-color",TS.lineColor);set("#c-point-color",TS.pointColor);set("#c-text-color",TS.textColor);
    set("#c-point-size",TS.pointSize);txt("#v-point",TS.pointSize);
    set("#c-line-thick",TS.lineThick);txt("#v-line",TS.lineThick);
    set("#c-font-size",TS.fontSize);txt("#v-font",TS.fontSize);
    set("#c-label-w",TS.labelWidth);txt("#v-lw",TS.labelWidth);
    set("#c-gap",TS.gap);txt("#v-gap",TS.gap);
    set("#c-page",TS.pageLen);txt("#v-page",TS.pageLen);
    const chk=(id,v)=>{const el=$("#tlw "+id); if(el) el.checked=v;};
    chk("#c-reverse",TS.reverse);chk("#c-grid",TS.showGrid);chk("#c-legend",TS.showLegend);
    set("#c-bg-scale",TS.bg.scale);txt("#v-bg-scale",TS.bg.scale+"%");
    set("#c-bg-x",TS.bg.x);txt("#v-bg-x",TS.bg.x);
    set("#c-bg-y",TS.bg.y);txt("#v-bg-y",TS.bg.y);
    set("#c-bg-op",TS.bg.opacity);txt("#v-bg-op",TS.bg.opacity+"%");
    const orient=$("#tlw #c-orient"); if(orient) orient.querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.getAttribute("data-v")===TS.orientation));
    const spac=$("#tlw #c-spacing"); if(spac) spac.querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.getAttribute("data-v")===TS.spacing));
    setBgStatus();
  }
  function bindTLControls(){
    const q=id=>$("#tlw "+id);
    const bindRange=(id,key,valId,suffix,sub)=>{const el=q(id); if(!el)return; el.addEventListener("input",e=>{const v=parseInt(e.target.value);if(sub)TS[sub][key]=v;else TS[key]=v;if(valId){const t=q(valId);if(t)t.textContent=v+(suffix||"");}renderTimelineSVG();});};
    q("#c-title").addEventListener("input",e=>{TS.title=e.target.value;renderTimelineSVG();});
    q("#c-precision").addEventListener("change",e=>{TS.precision=parseInt(e.target.value);renderTLEvents();renderTimelineSVG();});
    ["mo","d","h","min"].forEach(k=>{q("#r-"+k).addEventListener("input",e=>{TS.ratios[k]=parseFloat(e.target.value)||1;renderTimelineSVG();});});
    q("#c-line-color").addEventListener("input",e=>{TS.lineColor=e.target.value;renderTimelineSVG();});
    q("#c-point-color").addEventListener("input",e=>{TS.pointColor=e.target.value;renderTimelineSVG();});
    q("#c-text-color").addEventListener("input",e=>{TS.textColor=e.target.value;renderTimelineSVG();});
    bindRange("#c-point-size","pointSize","#v-point","");
    bindRange("#c-line-thick","lineThick","#v-line","");
    bindRange("#c-font-size","fontSize","#v-font","");
    bindRange("#c-label-w","labelWidth","#v-lw","");
    bindRange("#c-gap","gap","#v-gap","");
    bindRange("#c-page","pageLen","#v-page","");
    bindRange("#c-bg-scale","scale","#v-bg-scale","%","bg");
    bindRange("#c-bg-x","x","#v-bg-x","","bg");
    bindRange("#c-bg-y","y","#v-bg-y","","bg");
    bindRange("#c-bg-op","opacity","#v-bg-op","%","bg");
    q("#c-reverse").addEventListener("change",e=>{TS.reverse=e.target.checked;renderTimelineSVG();});
    q("#c-grid").addEventListener("change",e=>{TS.showGrid=e.target.checked;renderTimelineSVG();});
    q("#c-legend").addEventListener("change",e=>{TS.showLegend=e.target.checked;renderTimelineSVG();});
    q("#c-orient").querySelectorAll("button").forEach(b=>{b.onclick=()=>{TS.orientation=b.getAttribute("data-v");syncTLControls();renderTLEvents();renderTimelineSVG();};});
    q("#c-spacing").querySelectorAll("button").forEach(b=>{b.onclick=()=>{TS.spacing=b.getAttribute("data-v");syncTLControls();renderTimelineSVG();};});
    q("#c-bg-pick").onclick=()=>q("#c-bg-file").click();
    q("#c-bg-file").addEventListener("change",e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{TS.bg.data=r.result;setBgStatus();renderTimelineSVG();};r.readAsDataURL(f);e.target.value="";});
    q("#c-bg-remove").onclick=()=>{TS.bg.data=null;setBgStatus();renderTimelineSVG();};
    q("#c-add-track").onclick=()=>{TS.tracks.push(newTLTrack());normalizeTracks();renderTLTracks();renderTLEvents();renderTimelineSVG();};
    q("#c-add-ev").onclick=()=>{TS.events.push(newTLEvent());renderTLEvents();renderTimelineSVG();};
    q("#c-auto").onclick=autoArrange;
    const bulkBtn=q("#c-bulk-add");
    if(bulkBtn) bulkBtn.onclick=()=>{
      const ta=q("#c-bulk"); const lines=ta.value.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
      if(!lines.length){ toast("입력한 줄이 없어요"); return; }
      const startAlt=TS.events.length%2;   // 기존 사건 수에 이어 위·아래 번갈아
      let added=0, maxComp=TS.precision;
      lines.forEach((ln,idx)=>{
        const parts=ln.split("|").map(s=>s.trim());
        const comp=parseTuple(parts[0]||"");
        const title=parts[1]||"";
        const desc=parts.slice(2).join(" | ");
        if(!comp.length && !title) return;
        const ev=newTLEvent();
        for(let i=0;i<5;i++) ev.t[i]=(i<comp.length)?String(comp[i]):"";
        ev.title=title; ev.desc=desc; ev.side=(((startAlt+idx)%2)===0)?"a":"b";
        TS.events.push(ev); added++;
        maxComp=Math.max(maxComp, comp.length);
      });
      if(maxComp>TS.precision){ TS.precision=Math.min(5,maxComp); syncTLControls(); }
      ta.value="";
      renderTLEvents(); renderTimelineSVG();
      toast(added+"개 사건을 추가했어요");
    };
    q("#c-add-period").onclick=()=>{TS.periods.push(newTLPeriod());renderTLPeriods();renderTimelineSVG();};
    q("#c-add-marker").onclick=()=>{TS.markers.push(newTLMarker());renderTLMarkers();renderTimelineSVG();};
    q("#c-save").onclick=tlSaveJSON;
    q("#c-load-pick").onclick=()=>q("#c-load-file").click();
    q("#c-load-file").addEventListener("change",e=>{if(e.target.files[0])tlLoadJSON(e.target.files[0]);e.target.value="";});
    q("#t-png").onclick=exportTLPNG; q("#t-svg").onclick=exportTLSVG;
    q("#t-zoom").addEventListener("input",e=>{TLzoom=parseInt(e.target.value);q("#v-zoom").textContent=TLzoom+"%";applyZoom();});
    q("#t-100").onclick=()=>{TLzoom=100;q("#t-zoom").value=100;q("#v-zoom").textContent="100%";applyZoom();};
    q("#t-fit").onclick=()=>{const L=computeLayout();const wrap=q(".canvas-wrap");const avail=(wrap?wrap.clientWidth:900)-52;TLzoom=Math.max(20,Math.min(200,Math.floor(avail/L.W*100)));q("#t-zoom").value=TLzoom;q("#v-zoom").textContent=TLzoom+"%";applyZoom();};
  }
  function applyZoom(){const svg=$("#tlw #tl-svg"); if(!svg) return; const w=parseFloat(svg.getAttribute("width")),h=parseFloat(svg.getAttribute("height")),z=TLzoom/100; svg.style.width=(w*z)+"px"; svg.style.height=(h*z)+"px";}

  function renderTimelineSVG(){
    const wrap=$("#tlw .canvas-wrap"); if(!wrap) return;
    const L=computeLayout();
    const cur0=wrap.querySelector("#tl-svg"); if(cur0) cur0.outerHTML=svgMarkup(L,{});
    const svg=wrap.querySelector("#tl-svg"); if(!svg) return;
    const z=TLzoom/100;
    svg.style.width=(L.W*z)+"px"; svg.style.height=(L.H*z)+"px";
    svg.setAttribute("width",L.W); svg.setAttribute("height",L.H);
    const foot=$("#tlw #foot");
    if(foot) foot.textContent=`사건 ${validEvents().length}개 · 트랙 ${TS.tracks.length||1} · ${TS.orientation==="horizontal"?"가로":"세로"} · ${PLABEL.slice(0,TS.precision).join("·")} · ${Math.round(L.W)}×${Math.round(L.H)}px`;
    svg.querySelectorAll(".tl-ev").forEach(g=> g.addEventListener("click",()=>{
      const ev=TS.events.find(x=>String(x.id)===g.getAttribute("data-ev")); if(ev) openEventDoc(ev);
    }));
    tlTouch();
  }

  /* ---- 연표 전환/추가/이름/삭제 ---- */
  function tlSwitchTo(id){
    state._curTL=id; persist(); renderTimelineWorkspace();
  }
  function addTimeline(){
    promptModal("새 연표","","만들기",(nm)=>{
      const tl=newTimeline(nm); state.timelines.push(tl); state._curTL=tl.id; persist(); renderTimelineWorkspace();
    });
  }
  function renameTimeline(){
    if(!TS) return;
    promptModal("연표 이름 바꾸기",TS.name,"변경",(nm)=>{ TS.name=nm; if(!TS.title) TS.title=nm; persist(); renderTimelineWorkspace(); });
  }
  function deleteTimeline(){
    if(!TS) return;
    confirmModal(`'${TS.name}' 연표를 삭제할까요?`,"연대표만 지워집니다. 연결된 위키 문서는 그대로 남습니다.","삭제",()=>{
      state.timelines=state.timelines.filter(t=>t.id!==TS.id);
      state._curTL=state.timelines[0]?state.timelines[0].id:null;
      persist(); renderTimelineWorkspace();
    });
  }

  function renderTimelineWorkspace(){
    const view=$("#view");
    // 연표가 하나도 없으면 빈 화면
    if(!state.timelines.length){
      view.innerHTML=`<div id="tlw"><div class="tl-empty"><div style="font-size:15px;color:var(--ink);margin-bottom:6px">‘${tlesc(state.meta.name)}’에 아직 연표가 없어요.</div>
        <div style="margin-bottom:16px">연표를 만들면 사건이 곧 위키 문서가 됩니다.</div>
        <button class="btn primary" id="tl-first">＋ 연표 만들기</button></div></div>`;
      const b=$("#tlw #tl-first"); if(b) b.onclick=addTimeline;
      return;
    }
    TS=curTimeline(); state._curTL=TS.id;
    view.innerHTML=`<div id="tlw">
      <aside class="tl-panel">${timelinePanelHTML()}</aside>
      <main class="tl-stage">
        <div class="tl-toolbar">
          <div class="grp"><button class="btn" id="t-fit">화면 맞춤</button><button class="btn" id="t-100">실제 크기</button></div>
          <div class="divider"></div>
          <div class="grp" style="align-items:center;gap:6px"><span class="val">확대</span><input type="range" id="t-zoom" min="20" max="200" value="100" style="width:110px"><span class="val" id="v-zoom">100%</span></div>
          <div class="sp"></div>
          <div class="grp"><button class="btn primary" id="t-png">PNG 내보내기</button><button class="btn" id="t-svg">SVG 내보내기</button></div>
        </div>
        <div class="canvas-wrap" id="canvas-wrap"><svg id="tl-svg" xmlns="http://www.w3.org/2000/svg"></svg></div>
        <div class="footnote" id="foot">사건을 추가하면 연대표가 그려집니다.</div>
      </main></div>`;
    // 연표 전환 컨트롤
    const picker=$("#tlw #tl-picker"); if(picker) picker.addEventListener("change",e=>tlSwitchTo(e.target.value));
    const bn=$("#tlw #tl-new"); if(bn) bn.onclick=addTimeline;
    const br=$("#tlw #tl-rename"); if(br) br.onclick=renameTimeline;
    const bd=$("#tlw #tl-del"); if(bd) bd.onclick=deleteTimeline;
    bindTLControls();
    syncTLControls();
    renderTLTracks(); renderTLPeriods(); renderTLMarkers(); renderTLEvents();
    renderTimelineSVG();

  /* ================= 인포박스(정보 틀) 모듈 =================

     틀(template)은 세계관마다 보관(world.infoboxTemplates), 문서는 틀을 골라 값만 채움(doc.infobox).

  function ibMkFields(spec){ return spec.map(([type,label])=>({id:uid(),type,label})); }
  function ibTemplateFromPreset(p){ return { id:uid(), name:p.name, accent:p.accent, fields:ibMkFields(p.spec) }; }
  function ibBlankTemplate(){ return { id:uid(), name:"새 틀", accent:"#0c63bd",
    fields:[{id:uid(),type:"image",label:"사진"},{id:uid(),type:"text",label:"이름"},{id:uid(),type:"section",label:"개요"},{id:uid(),type:"text",label:"항목"}] }; }
  function normalizeInfoboxTemplate(t){
    if(!t.id) t.id=uid();
    if(!t.name) t.name="새 틀";
    if(!t.accent) t.accent="#0c63bd";
    if(!Array.isArray(t.fields)) t.fields=[];
    t.fields.forEach(f=>{ if(!f.id) f.id=uid(); if(!IB_FIELD_TYPES[f.type]) f.type="text"; if(f.label==null) f.label=""; });
    return t;
  }
  function ibTemplateById(id){ return (state.infoboxTemplates||[]).find(t=>t.id===id)||null; }

  // 문서의 검색/역링크용 텍스트: 본문 + 인포박스 값(라벨 포함)
  function docExtraText(d){
    if(!d.infobox||!d.infobox.values) return "";
    const tpl=ibTemplateById(d.infobox.templateId);
    let parts=[d.infobox.title||""];
    Object.keys(d.infobox.values).forEach(fid=>{
      const v=d.infobox.values[fid];
      if(typeof v==="string" && v && !v.startsWith("data:")) parts.push(v);  // data:URL(이미지)는 제외
    });
    return parts.join(" ");
  }

  // 섹션 가시성: 어떤 구분(section) 아래에 실제로 값이 있는 항목이 하나도 없으면 그 구분은 숨김
  function ibVisibleFlags(tpl, V){
    const n=tpl.fields.length, show=new Array(n).fill(false);
    const hasVal=f=>{ const v=V[f.id]; return typeof v==="string" && v.trim()!==""; };
    for(let i=0;i<n;i++){
      const f=tpl.fields[i];
      if(f.type==="section"){
        for(let j=i+1;j<n && tpl.fields[j].type!=="section";j++){
          if(hasVal(tpl.fields[j])){ show[i]=true; break; }
        }
      } else show[i]=hasVal(f);
    }
    return show;
  }

  function renderInfobox(doc){
    if(!doc.infobox) return "";
    const tpl=ibTemplateById(doc.infobox.templateId); if(!tpl) return "";
    const V=doc.infobox.values||{};
    const show=ibVisibleFlags(tpl,V);
    const accent=doc.infobox.accent||tpl.accent||"#0c63bd";
    const title=(doc.infobox.title||"").trim()||doc.title;
    let body="";
    tpl.fields.forEach((f,i)=>{
      if(!show[i]) return;
      const v=V[f.id]||"";
      if(f.type==="image"){
        body+=`<div class="ib-img"><img src="${attr(v)}" alt="${attr(f.label)}"></div>`;
      }else if(f.type==="section"){
        body+=`<div class="ib-sec">${esc(f.label)}</div>`;
      }else if(f.type==="badge"){
        body+=`<div class="ib-badge">${inline(v,doc)}</div>`;
      }else if(f.type==="note"){
        body+=`<div class="ib-note">${inline(v,doc)}</div>`;
      }else{
        body+=`<div class="ib-row"><div class="ib-k">${esc(f.label)}</div><div class="ib-v">${inline(v,doc)}</div></div>`;
      }
    });
    return `<aside class="ib" style="--ib-accent:${attr(accent)}"><div class="ib-title">${esc(title)}</div>${body}</aside>`;
  }

  /* ---------- 편집기: 인포박스 패널 ---------- */
  function infoboxEditorHTML(doc){
    const tpls=state.infoboxTemplates||[];
    const ib=doc.infobox;
    const opts=`<option value="">— 없음 —</option>`+tpls.map(t=>`<option value="${t.id}" ${ib&&ib.templateId===t.id?"selected":""}>${esc(t.name)}</option>`).join("");
    let fieldsHtml="";
    if(ib){
      const tpl=ibTemplateById(ib.templateId);
      if(tpl){
        const V=ib.values||{};
        fieldsHtml=`<input class="ib-title-in" data-ibtitle placeholder="인포박스 제목(비우면 문서 제목)" value="${attr(ib.title||"")}">`;
        tpl.fields.forEach(f=>{
          const v=V[f.id]||"";
          if(f.type==="section"){ fieldsHtml+=`<div class="ib-edit-sec">${esc(f.label||"구분")}</div>`; return; }
          if(f.type==="image"){
            fieldsHtml+=`<div class="ib-edit-img">
              <span class="ib-edit-lbl">${esc(f.label||"사진")}</span>
              ${v?`<img src="${attr(v)}" alt=""><button class="mini" data-ibimgdel="${f.id}">제거</button>`
                 :`<button class="mini" data-ibimgpick="${f.id}">이미지 올리기</button>`}
            </div>`;
            return;
          }
          const tag = f.type==="note" ? `<textarea class="ib-edit-val" data-ibfield="${f.id}" rows="2" placeholder="${esc(f.label)}">${esc(v)}</textarea>`
                                      : `<input class="ib-edit-val" data-ibfield="${f.id}" placeholder="${esc(f.label)}" value="${attr(v)}">`;
          const badge = f.type==="badge" ? " badge":"";
          fieldsHtml+=`<div class="ib-edit-row${badge}"><label class="ib-edit-lbl">${esc(f.label)}</label>${tag}</div>`;
        });
      }
    }
    return `
      <div class="ib-panel">
        <div class="lbl" style="font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700">인포박스</div>
        <div class="ib-panel-top">
          <select id="ibTplSel">${opts}</select>
          <button class="btn" id="ibManage" type="button">틀 관리</button>
        </div>
        <div class="ib-fields">${fieldsHtml}</div>
      </div>`;
  }
  // 숨은 파일 input (이미지 필드용) — 한 번만 만들어 재사용
  function ibFilePicker(cb){
    let el=document.getElementById("ibFileHidden");
    if(!el){ el=document.createElement("input"); el.type="file"; el.id="ibFileHidden"; el.accept="image/*"; el.style.display="none"; document.body.appendChild(el); }
    el.onchange=()=>{ const f=el.files[0]; if(f){ const r=new FileReader(); r.onload=()=>cb(r.result); r.readAsDataURL(f); } el.value=""; };
    el.click();
  }
  function bindInfoboxEditor(doc){
    const sel=$("#ibTplSel");
    if(sel) sel.addEventListener("change",()=>{
      captureEditor();
      const id=sel.value;
      if(!id){ doc.infobox=null; }
      else if(!doc.infobox || doc.infobox.templateId!==id){ doc.infobox={ templateId:id, title:doc.infobox?doc.infobox.title:"", values:{} }; }
      renderEditor();
    });
    const mg=$("#ibManage"); if(mg) mg.addEventListener("click", openInfoboxManager);
    const v=$("#view");
    v.querySelectorAll("[data-ibimgpick]").forEach(b=> b.addEventListener("click",()=>{
      const fid=b.dataset.ibimgpick;
      ibFilePicker(dataUrl=>{ captureEditor(); if(!doc.infobox.values)doc.infobox.values={}; doc.infobox.values[fid]=dataUrl; renderEditor(); });
    }));
    v.querySelectorAll("[data-ibimgdel]").forEach(b=> b.addEventListener("click",()=>{
      const fid=b.dataset.ibimgdel; captureEditor(); if(doc.infobox&&doc.infobox.values) delete doc.infobox.values[fid]; renderEditor();
    }));
  }
  // 편집 중 인포박스 입력값을 doc에 담기(다시 그리기/저장 전에 호출)
  function captureInfobox(doc){
    if(!doc || !doc.infobox) return;
    const v=$("#view"); if(!v) return;
    if(!doc.infobox.values) doc.infobox.values={};
    const t=v.querySelector("[data-ibtitle]"); if(t) doc.infobox.title=t.value;
    v.querySelectorAll("[data-ibfield]").forEach(el=>{ doc.infobox.values[el.dataset.ibfield]=el.value; });
  }

  /* ---------- 틀 관리 모달 ---------- */
  function openInfoboxManager(){
    if(!state.infoboxTemplates) state.infoboxTemplates=[];
    function body(){
      const list=state.infoboxTemplates.map(t=>{
        const fcount=t.fields.filter(f=>f.type!=="section").length;
        return `<div class="ibm-row"><span class="sw" style="background:${attr(t.accent)}"></span>
          <span class="nm">${esc(t.name)}</span><span class="ct">${fcount}항목</span>
          <button class="btn mini" data-ibedit="${t.id}">편집</button>
          <button class="btn mini" data-ibdup="${t.id}">복제</button>
          <button class="tm-del" data-ibdel="${t.id}">삭제</button></div>`;
      }).join("") || `<div style="color:var(--muted);font-size:13px;padding:6px 0">아직 틀이 없습니다. 아래에서 프리셋으로 시작하세요.</div>`;
      const presetBtns=INFOBOX_PRESETS.map(p=>`<button class="btn mini" data-ibpreset="${p.key}">${esc(p.name)}</button>`).join("");
      return `<h3>인포박스 틀 관리</h3>
        <p style="color:var(--muted);font-size:12.5px;margin:-4px 0 10px">문서마다 이 틀을 골라 값만 채웁니다. 나무위키식 '정보 틀'처럼 섹션·항목·색을 자유롭게 짜세요.</p>
        <div class="ibm-list">${list}</div>
        <div class="ibm-add">
          <div class="lbl">프리셋에서 시작</div>
          <div class="ibm-presets">${presetBtns}</div>
          <button class="btn" id="ibBlank" style="margin-top:8px">빈 틀 만들기</button>
        </div>
        <div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn" id="ibmClose">닫기</button></div>`;
    }
    function wire(){
      $("#ibmClose").addEventListener("click", ()=>{ if(cur.mode==="edit") captureEditor(); closeModal(); if(cur.mode==="edit") renderEditor(); });
      $("#ibBlank").addEventListener("click",()=>{ const t=ibBlankTemplate(); state.infoboxTemplates.push(t); save(); openTemplateEditor(t.id); });
      document.querySelectorAll("[data-ibpreset]").forEach(b=> b.addEventListener("click",()=>{
        const p=INFOBOX_PRESETS.find(x=>x.key===b.dataset.ibpreset); if(!p) return;
        const t=ibTemplateFromPreset(p); state.infoboxTemplates.push(t); save(); openTemplateEditor(t.id);
      }));
      document.querySelectorAll("[data-ibedit]").forEach(b=> b.addEventListener("click",()=> openTemplateEditor(b.dataset.ibedit)));
      document.querySelectorAll("[data-ibdup]").forEach(b=> b.addEventListener("click",()=>{
        const src=ibTemplateById(b.dataset.ibdup); if(!src) return;
        const copy=normalizeInfoboxTemplate(JSON.parse(JSON.stringify(src))); copy.id=uid(); copy.name=src.name+" 복사"; copy.fields.forEach(f=>f.id=uid());
        state.infoboxTemplates.push(copy); save(); showModal(body(), wire);
      }));
      document.querySelectorAll("[data-ibdel]").forEach(b=> b.addEventListener("click",()=>{
        const t=ibTemplateById(b.dataset.ibdel); if(!t) return;
        const used=Object.values(state.docs).filter(d=>d.infobox&&d.infobox.templateId===t.id).length;
        const msg=used?`이 틀을 쓰는 문서 ${used}개의 인포박스도 사라집니다.`:"되돌릴 수 없습니다.";
        confirmModal(`'${t.name}' 틀을 삭제할까요?`, msg, "삭제", ()=>{
          state.infoboxTemplates=state.infoboxTemplates.filter(x=>x.id!==t.id);
          Object.values(state.docs).forEach(d=>{ if(d.infobox&&d.infobox.templateId===t.id) d.infobox=null; });
          save(); showModal(body(), wire);
        });
      }));
    }
    showModal(body(), wire);
  }

  function openTemplateEditor(tplId){
    const tpl=ibTemplateById(tplId); if(!tpl){ openInfoboxManager(); return; }
    function body(){
      const rows=tpl.fields.map((f,i)=>`
        <div class="ibf-row" data-i="${i}">
          <select class="ibf-type" data-i="${i}">${Object.keys(IB_FIELD_TYPES).map(k=>`<option value="${k}" ${f.type===k?"selected":""}>${esc(IB_FIELD_TYPES[k])}</option>`).join("")}</select>
          <input class="ibf-label" data-i="${i}" value="${attr(f.label)}" placeholder="${f.type==="section"?"소제목":f.type==="note"?"각주 라벨(미표시)":"라벨"}">
          <button class="ibf-mv" data-up="${i}" title="위로">↑</button>
          <button class="ibf-mv" data-down="${i}" title="아래로">↓</button>
          <button class="ibf-del" data-del="${i}" title="삭제">×</button>
        </div>`).join("");
      return `<h3>틀 편집</h3>
        <div class="row" style="gap:8px;margin-bottom:10px">
          <input id="ibtName" value="${attr(tpl.name)}" placeholder="틀 이름" style="flex:1">
          <label class="inline" style="gap:6px;font-size:12px;color:var(--muted)">제목색 <input type="color" id="ibtAccent" value="${attr(tpl.accent)}"></label>
        </div>
        <div class="ibf-list">${rows}</div>
        <button class="btn" id="ibfAdd" style="width:100%;border-style:dashed;margin-top:8px">＋ 항목 추가</button>
        <div class="row" style="justify-content:space-between;margin-top:14px">
          <button class="btn" id="ibtBack">← 목록</button>
          <button class="btn primary" id="ibtSave">저장</button>
        </div>`;
    }
    function commitInputs(){
      document.querySelectorAll(".ibf-type").forEach(s=>{ tpl.fields[+s.dataset.i].type=s.value; });
      document.querySelectorAll(".ibf-label").forEach(inp=>{ tpl.fields[+inp.dataset.i].label=inp.value; });
      const nm=$("#ibtName"); if(nm) tpl.name=nm.value.trim()||"새 틀";
      const ac=$("#ibtAccent"); if(ac) tpl.accent=ac.value;
    }
    function wire(){
      $("#ibfAdd").addEventListener("click",()=>{ commitInputs(); tpl.fields.push({id:uid(),type:"text",label:""}); showModal(body(),wire); });
      document.querySelectorAll(".ibf-type").forEach(s=> s.addEventListener("change",()=>{ commitInputs(); showModal(body(),wire); }));
      document.querySelectorAll("[data-del]").forEach(b=> b.addEventListener("click",()=>{ commitInputs(); tpl.fields.splice(+b.dataset.del,1); showModal(body(),wire); }));

  /* ================= WYSIWYG 본문 편집 (풀 서식) =================

  const WY = {};

  const WY_BLOCK = {H1:"h2",H2:"h2",H3:"h3",H4:"h3",H5:"h3",H6:"h3",P:"p",DIV:"p",
    UL:"ul",OL:"ol",LI:"li",BLOCKQUOTE:"blockquote",HR:"hr",

    DETAILS:"details",SUMMARY:"summary"};

  const WY_STYLE = {
    span:["color","background-color","font-family","font-size","text-decoration"],
    p:["text-align"], h2:["text-align"], h3:["text-align"], li:["text-align"], blockquote:["text-align"],
    table:["width","border-collapse","border","border-color","border-width","border-style","border-radius","overflow","background-color","background-image"],
    td:["text-align","vertical-align","color","background-color","background-image","border","border-color","border-width","border-style","font-family","font-size","width"],
    th:["text-align","vertical-align","color","background-color","background-image","border","border-color","border-width","border-style","font-family","font-size","width"]
  };
  function cleanStyle(el, props){
    const out=[];
    (props||[]).forEach(p=>{
      let v=""; try{ v=el.style.getPropertyValue(p); }catch(e){}
      if(v && !/url\s*\(|expression|javascript:|@import/i.test(v)) out.push(p+":"+v);

  function sanitizeBodyHtml(html){
    const d=new DOMParser().parseFromString("<body><div id='__r'>"+(html||"")+"</div></body>","text/html");
    const root=d.getElementById("__r");

    [...root.childNodes].forEach(n=> cleanInto(n, frag, d));
    const wrap=d.createElement("div"); wrap.appendChild(frag);

  function cleanInto(node, parent, d){
    if(node.nodeType===3){ parent.appendChild(d.createTextNode(node.nodeValue)); return; }
    if(node.nodeType!==1) return;
    const tag=node.tagName;
    if(WY_DROP[tag]) return;
    if(WY_UNWRAP[tag]){ [...node.childNodes].forEach(c=> cleanInto(c,parent,d)); return; }
    // 경고/스포일러 상자(callout)
    if(tag==="DIV" && /\bcallout\b/.test(node.getAttribute("class")||"")){
      const el=d.createElement("div"); el.setAttribute("class","callout");
      const cl=(node.getAttribute("data-cl")||"spoiler").replace(/[^a-z]/gi,"").slice(0,12)||"spoiler";
      el.setAttribute("data-cl",cl);
      [...node.childNodes].forEach(c=> cleanInto(c,el,d)); parent.appendChild(el); return;
    }
    const mapped = WY_BLOCK[tag] || WY_INLINE[tag];
    if(!mapped){ [...node.childNodes].forEach(c=> cleanInto(c,parent,d)); return; }
    const el=d.createElement(mapped);
    if(mapped==="a"){
      const cls=node.getAttribute("class")||"", dt=node.getAttribute("data-title");
      if(dt!=null || /\bwlink\b/.test(cls)){
        const t=(dt||node.textContent||"").trim();
        if(!t){ [...node.childNodes].forEach(c=> cleanInto(c,parent,d)); return; }
        el.setAttribute("class","wlink"); el.setAttribute("data-title",t);
      } else {
        let href=node.getAttribute("href")||"";
        if(!/^(https?:|mailto:|#)/i.test(href)){ [...node.childNodes].forEach(c=> cleanInto(c,parent,d)); return; }
        if(/^#/.test(href)){ [...node.childNodes].forEach(c=> cleanInto(c,parent,d)); return; } // 각주 내부 앵커는 뷰에서 생성
        el.setAttribute("class","ext"); el.setAttribute("href",href); el.setAttribute("target","_blank"); el.setAttribute("rel","noopener");
      }
    } else if(mapped==="img"){
      let src=node.getAttribute("src")||"";
      if(!/^(data:image\/|https?:)/i.test(src)) return;
      el.setAttribute("src",src); const alt=node.getAttribute("alt"); if(alt) el.setAttribute("alt",alt);
    } else if(mapped==="sup" || mapped==="sub"){
      const cls=node.getAttribute("class")||"", note=node.getAttribute("data-note");
      if(mapped==="sup" && (note!=null || /\bfn\b/.test(cls))){
        el.setAttribute("class","fn"); el.setAttribute("data-note", note||node.textContent||"");
        parent.appendChild(el); return;   // 각주 마커는 내용 비움(뷰에서 번호 생성)
      }
    } else if(mapped==="span"){
      if(/\bspoiler\b/.test(node.getAttribute("class")||"")){
        el.setAttribute("class","spoiler");
        [...node.childNodes].forEach(c=> cleanInto(c,el,d)); parent.appendChild(el); return;
      }
      const st=cleanStyle(node, WY_STYLE.span);
      if(st) el.setAttribute("style",st);
      else { const tmp=d.createDocumentFragment(); [...node.childNodes].forEach(c=> cleanInto(c,tmp,d)); parent.appendChild(tmp); return; }
    } else if(mapped==="details"){
      el.setAttribute("class","fold");   // open 속성은 제거 → 뷰에선 기본 접힘
    } else if(WY_STYLE[mapped]){
      const st=cleanStyle(node, WY_STYLE[mapped]); if(st) el.setAttribute("style",st);
      if(mapped==="table") el.setAttribute("class","wtable");
      if(mapped==="td"||mapped==="th"){ ["colspan","rowspan"].forEach(a=>{ const v=parseInt(node.getAttribute(a)); if(v>1) el.setAttribute(a,v); }); }
    }
    if(mapped==="hr"||mapped==="br"||mapped==="img"){ parent.appendChild(el); return; }
    [...node.childNodes].forEach(c=> cleanInto(c, el, d));
    parent.appendChild(el);
  }

    const b=_htmlDoc(doc.body).getElementById("__b");

    b.querySelectorAll("h2,h3").forEach(h=>{ const id="h"+(hc++); h.setAttribute("id",id); heads.push({lv:h.tagName==="H2"?2:3,id,text:h.textContent.trim()}); });

    const fns=[...b.querySelectorAll("sup.fn")];
    if(fns.length){
      fns.forEach((sup,i)=>{ const n=i+1; sup.setAttribute("id","fnref"+n); sup.innerHTML=`<a href="#fn${n}" data-fnjump="fn${n}">[${n}]</a>`; });

    });

  }

    const sm=document.createElement("summary"); sm.textContent=(title||"펼치기").trim(); d.appendChild(sm);
    const p=document.createElement("p"); p.innerHTML="여기에 내용을 쓰세요."; d.appendChild(p);
    wyInsertNode(d); const after=document.createElement("p"); after.innerHTML="<br>"; if(d.parentNode) d.after(after); }); }
  const CALLOUT_DEF={
    stub:"📎 이 문서는 아직 짧은 토막글입니다. 내용을 보태 주세요.",
    cleanup:"🧹 정리가 필요한 문서입니다. ",
    source:"📌 출처가 필요한 내용이 있습니다. ",
    disambig:"🔀 동음이의 문서입니다 — 아래에서 찾는 항목을 고르세요.",
    noncanon:"⚠ 비정사(공식 설정 아님) 내용입니다. ",
    uncertain:"❓ 아직 확정되지 않은 내용입니다. ",
    spoiler:"⚠ 전개 누설(스포일러)이 포함되어 있습니다.",
    warn:"⚠ 트리거 경고: ", info:"ℹ 참고: ", tip:"✦ " };
  function wyCallout(type){ wyFocus();
    const box=document.createElement("div"); box.className="callout"; box.setAttribute("data-cl",type);
    const p=document.createElement("p"); p.textContent=CALLOUT_DEF[type]||"⚠ "; box.appendChild(p);
    wyInsertNode(box); const after=document.createElement("p"); after.innerHTML="<br>"; if(box.parentNode) box.after(after); }
  function wyAlign(dir){ const cell=wyCurrentCell(); if(cell){ cell.style.textAlign=dir; return; }
    wyExec(dir==="left"?"justifyLeft":dir==="center"?"justifyCenter":dir==="right"?"justifyRight":"justifyFull"); }
  function wyWikilink(){ const r=wyRange(); const sel=r?r.toString().trim():""; promptModal("위키 링크 — 문서 제목", sel, "넣기", (title)=>{ wyFocus(); const a=document.createElement("a"); a.className="wlink"; a.setAttribute("data-title",title.trim()); a.textContent=(sel||title).trim(); wyInsertNode(a); }); }
  function wyExtLink(){ const r=wyRange(); const sel=r?r.toString().trim():""; promptModal("링크 주소(URL)","https://","링크",(url)=>{ if(!/^https?:/i.test(url)){toast("http(s) 주소만");return;} wyFocus(); const a=document.createElement("a"); a.className="ext"; a.href=url; a.target="_blank"; a.rel="noopener"; a.textContent=sel||url; wyInsertNode(a); }); }
  function wyFootnote(){ promptModal("주석 내용 (문서 끝에 번호로 모입니다)","","넣기",(note)=>{ wyFocus(); const sup=document.createElement("sup"); sup.className="fn"; sup.setAttribute("data-note",note); sup.textContent="[주석]"; wyInsertNode(sup); }); }
  function wyPickImage(cb){ let el=document.getElementById("wyFileHidden"); if(!el){ el=document.createElement("input"); el.type="file"; el.id="wyFileHidden"; el.accept="image/*"; el.style.display="none"; document.body.appendChild(el);} el.onchange=()=>{ const f=el.files[0]; if(f){ const r=new FileReader(); r.onload=()=>cb(r.result,f.name.replace(/\.[^.]+$/,"")); r.readAsDataURL(f);} el.value=""; }; el.click(); }
  function wyInsertImageSrc(src){ const img=document.createElement("img"); img.src=src; wyFocus(); wyInsertNode(img); }
  function wyImage(doc){ wyPickImage((dataUrl,name)=>{ let base=name||"그림",nm=base,n=2; while(doc.images.some(i=>i.name===nm)) nm=base+" "+n++; doc.images.push({id:uid(),name:nm,dataUrl}); wyInsertImageSrc(dataUrl); }); }
  function wyTable(){ promptModal("표 크기 — 열x행 (예: 3x2)","3x2","만들기",(spec)=>{ const m=String(spec).match(/(\d+)\s*[x×*,]\s*(\d+)/); let cols=m?+m[1]:3, rows=m?+m[2]:2; cols=Math.max(1,Math.min(12,cols)); rows=Math.max(1,Math.min(50,rows));
    const tbl=document.createElement("table"); tbl.className="wtable"; const thead=document.createElement("thead"); const htr=document.createElement("tr"); for(let c=0;c<cols;c++){const th=document.createElement("th"); th.innerHTML="<br>"; htr.appendChild(th);} thead.appendChild(htr); tbl.appendChild(thead);
    const tb=document.createElement("tbody"); for(let rr=0;rr<rows;rr++){const tr=document.createElement("tr"); for(let c=0;c<cols;c++){const td=document.createElement("td"); td.innerHTML="<br>"; tr.appendChild(td);} tb.appendChild(tr);} tbl.appendChild(tb);
    wyFocus(); wyInsertNode(tbl); const p=document.createElement("p"); p.innerHTML="<br>"; if(tbl.parentNode) tbl.after(p); }); }
  function wyRowAdd(){ const c=wyCurrentCell(); if(!c){toast("표 안에 커서를 두세요");return;} const tr=c.closest("tr"); const n=tr.children.length; const nt=document.createElement("tr"); for(let i=0;i<n;i++){const td=document.createElement("td"); td.innerHTML="<br>"; nt.appendChild(td);} tr.after(nt); }
  function wyRowDel(){ const c=wyCurrentCell(); if(!c){toast("표 안에 커서를 두세요");return;} const tr=c.closest("tr"); if(tr.closest("table").querySelectorAll("tr").length<=1){toast("마지막 행");return;} tr.remove(); }
  function wyColAdd(){ const c=wyCurrentCell(); if(!c){toast("표 안에 커서를 두세요");return;} const idx=[...c.parentNode.children].indexOf(c); c.closest("table").querySelectorAll("tr").forEach(tr=>{ const ref=tr.children[idx]; const isH=tr.parentNode.tagName==="THEAD"; const cell=document.createElement(isH?"th":"td"); cell.innerHTML="<br>"; if(ref) ref.after(cell); else tr.appendChild(cell); }); }
  function wyColDel(){ const c=wyCurrentCell(); if(!c){toast("표 안에 커서를 두세요");return;} const idx=[...c.parentNode.children].indexOf(c); if(c.parentNode.children.length<=1){toast("마지막 열");return;} c.closest("table").querySelectorAll("tr").forEach(tr=>{ if(tr.children[idx]) tr.children[idx].remove(); }); }
  function wyCellBg(color){ const c=wyCurrentCell(); if(!c){toast("표 셀에 커서를 두세요");return;} c.style.backgroundImage="none"; c.style.backgroundColor=color; }
  function wyCellGrad(a,b2){ const c=wyCurrentCell(); if(!c){toast("표 셀에 커서를 두세요");return;} c.style.backgroundImage="linear-gradient(135deg,"+a+","+b2+")"; }
  function wyVAlign(v){ const c=wyCurrentCell(); if(!c){toast("표 셀에 커서를 두세요");return;} c.style.verticalAlign=v; }
  function wyCellsEach(cb){ const t=wyCurrentTable(); if(!t){toast("표 안에 커서를 두세요");return null;} t.querySelectorAll("th,td").forEach(cb); return t; }
  function wyBorderStyle(v){ wyCellsEach(cell=>{ if(v==="none"){cell.style.borderStyle="none";} else { cell.style.borderStyle=v; if(!cell.style.borderWidth) cell.style.borderWidth="1px"; if(!cell.style.borderColor) cell.style.borderColor="var(--line)"; } }); }
  function wyBorderWidth(v){ wyCellsEach(cell=>{ cell.style.borderWidth=v+"px"; if(!cell.style.borderStyle||cell.style.borderStyle==="none") cell.style.borderStyle="solid"; if(!cell.style.borderColor) cell.style.borderColor="var(--line)"; }); }
  function wyBorderColor(v){ wyCellsEach(cell=>{ cell.style.borderColor=v; if(!cell.style.borderStyle||cell.style.borderStyle==="none") cell.style.borderStyle="solid"; if(!cell.style.borderWidth) cell.style.borderWidth="1px"; }); }
  function wyRadius(v){ const t=wyCurrentTable(); if(!t){toast("표 안에 커서를 두세요");return;} t.style.borderRadius=v+"px"; t.style.overflow=v>0?"hidden":""; }
  function wyTableWidth(v){ const t=wyCurrentTable(); if(!t){toast("표 안에 커서를 두세요");return;} t.style.width = v==="auto"?"auto":v; }

  function getEditorHtml(){ const ed=wyEd(); return ed? sanitizeBodyHtml(ed.innerHTML) : ""; }

  function bindWysiwyg(doc){
    const bar=$(".wy-toolbar"); if(!bar) return;
    const act=cmd=>{ switch(cmd){
      case "undo":return wyExec("undo"); case "redo":return wyExec("redo");
      case "bold":return wyExec("bold"); case "italic":return wyExec("italic");
      case "underline":return wyExec("underline"); case "strike":return wyExec("strikeThrough");
      case "sup":return wyExec("superscript"); case "sub":return wyExec("subscript");
      case "code":return wyCode(); case "clear":return (wyExec("removeFormat"),wyExec("unlink"));
      case "alignL":return wyAlign("left"); case "alignC":return wyAlign("center"); case "alignR":return wyAlign("right"); case "alignJ":return wyAlign("justify");
      case "ul":return wyExec("insertUnorderedList"); case "ol":return wyExec("insertOrderedList");
      case "indent":return wyExec("indent"); case "outdent":return wyExec("outdent");
      case "quote":return wyBlock("blockquote"); case "hr":return wyHr();
      case "wikilink":return wyWikilink(); case "extlink":return wyExtLink(); case "image":return wyImage(doc); case "footnote":return wyFootnote();
      case "fold":return wyFold(); case "spoiler":return wySpoiler();
      case "table":return wyTable(); case "row+":return wyRowAdd(); case "row-":return wyRowDel(); case "col+":return wyColAdd(); case "col-":return wyColDel();
      case "gradApply":return wyCellGrad(bar.querySelector('[data-wy="grad1"]').value, bar.querySelector('[data-wy="grad2"]').value);
    }};
    bar.querySelectorAll("button[data-wy]").forEach(btn=> btn.addEventListener("mousedown", e=>{ e.preventDefault(); act(btn.dataset.wy); }));
    const onSel=(name,fn,reset)=>{ const el=bar.querySelector('[data-wy="'+name+'"]'); if(el) el.addEventListener("change",()=>{ if(el.value!=="") fn(el.value); if(reset) el.value=""; }); };
    onSel("block", v=>wyBlock(v), true);
    onSel("font", v=>{ if(v==="__addfont__"){ openFontManager(); return; } wyWrapStyle("fontFamily",v); }, true);
    onSel("size", v=>wyWrapStyle("fontSize", v+"px"));
    onSel("callout", v=>wyCallout(v), true);
    onSel("valign", v=>wyVAlign(v), true);
    onSel("bstyle", v=>wyBorderStyle(v), true);
    onSel("bwidth", v=>wyBorderWidth(v), true);
    onSel("radius", v=>wyRadius(+v), true);
    onSel("twidth", v=>wyTableWidth(v), true);
    const onColor=(name,fn)=>{ const el=bar.querySelector('[data-wy="'+name+'"]'); if(el) el.addEventListener("input",()=>fn(el.value)); };
    onColor("fore", v=>wyExec("foreColor",v));
    onColor("hilite", v=>wyExec("hiliteColor",v));
    onColor("cellbg", v=>wyCellBg(v));
    onColor("bcolor", v=>wyBorderColor(v));
    const ed=wyEd();
    if(ed){
      ed.querySelectorAll("details").forEach(dt=> dt.open=true);   // 편집 중엔 접기 내용 펼쳐 보이게
      ed.addEventListener("click", e=>{
        const sm=e.target.closest && e.target.closest("summary"); if(sm) e.preventDefault();  // 편집 중 접힘 토글 방지
        const a=e.target.closest && e.target.closest("a"); if(a) e.preventDefault();
        const fn=e.target.closest && e.target.closest("sup.fn");
        if(fn){ const cur0=fn.getAttribute("data-note")||""; promptModal("주석 수정", cur0, "저장", (nv)=>{ fn.setAttribute("data-note",nv); }); }
      });
    }
  }

  /* ================= 페이지 색상 · 사용자 폰트 · 이미지 내보내기 ================= */

  /* ---------- 사용자 폰트 ---------- */
  function fontFaceCss(fonts){
    return (fonts||[]).map(f=>`@font-face{font-family:'${(f.name||"").replace(/'/g,"")}';src:url(${f.dataUrl});font-display:swap;}`).join("\n");
  }
  function injectFonts(){
    let el=document.getElementById("customFonts");
    if(!el){ el=document.createElement("style"); el.id="customFonts"; document.head.appendChild(el); }
    el.textContent=fontFaceCss(state.fonts||[]);
  }
  function openFontManager(){
    if(!state.fonts) state.fonts=[];
    function body(){
      const list=state.fonts.length? state.fonts.map(f=>`
        <div class="fm-row">
          <span class="fm-name" style="font-family:'${attr(f.name)}'">${esc(f.name)}</span>
          <span class="fm-prev" style="font-family:'${attr(f.name)}'">가나다 AaBb 123</span>
          <button class="btn mini" data-fmren="${f.id}">이름</button>
          <button class="tm-del" data-fmdel="${f.id}">삭제</button>
        </div>`).join("") : `<div style="color:var(--muted);font-size:13px;padding:6px 0">아직 올린 폰트가 없습니다.</div>`;
      return `<h3>내 폰트</h3>
        <p style="color:var(--muted);font-size:12.5px;margin:-4px 0 10px">내려받은 글꼴 파일(.ttf·.otf·.woff·.woff2)을 올리면 이 기기 네트워크 없이도 문서에 쓰고, 이미지로 내보낼 때도 그대로 나옵니다. 파일에 함께 저장돼 다른 기기에서도 열립니다.</p>
        <div class="fm-list">${list}</div>
        <button class="btn" id="fmAdd" style="width:100%;border-style:dashed;margin-top:10px">＋ 폰트 파일 올리기</button>
        <div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn" id="fmClose">닫기</button></div>`;
    }
    function wire(){
      $("#fmClose").addEventListener("click", ()=>{ closeModal(); if(cur.mode==="edit") renderEditor(); });
      $("#fmAdd").addEventListener("click", ()=>{
        const inp=document.createElement("input"); inp.type="file"; inp.accept=".ttf,.otf,.woff,.woff2,font/*";
        inp.onchange=()=>{ const f=inp.files[0]; if(!f) return;
          if(f.size>8*1024*1024){ toast("폰트 파일은 8MB 이하를 권장합니다"); }
          const r=new FileReader();
          r.onload=()=>{ const base=f.name.replace(/\.[^.]+$/,""); let nm=base,n=2; while(state.fonts.some(x=>x.name===nm)) nm=base+" "+n++;
            state.fonts.push({id:uid(), name:nm, dataUrl:r.result}); save(); injectFonts(); showModal(body(),wire); toast("폰트를 추가했어요"); };
          r.readAsDataURL(f);
        };
        inp.click();
      });
      document.querySelectorAll("[data-fmren]").forEach(b=> b.addEventListener("click",()=>{
        const f=state.fonts.find(x=>x.id===b.dataset.fmren); if(!f) return;
        promptModal("폰트 이름", f.name, "변경", (nv)=>{ f.name=nv.trim()||f.name; save(); injectFonts(); showModal(body(),wire); });
      }));
      document.querySelectorAll("[data-fmdel]").forEach(b=> b.addEventListener("click",()=>{
        state.fonts=state.fonts.filter(x=>x.id!==b.dataset.fmdel); save(); injectFonts(); showModal(body(),wire);
      }));
    }
    showModal(body(), wire);
  }

  function pageStyle(doc){
    let s="";
    if(doc.pageBg) s+=`background:${doc.pageBg};`;
    if(doc.pageText) s+=`color:${doc.pageText};`;
    return s;
  }

      <label class="pg-color" title="글자색"><span style="color:${attr(doc.pageText||'#1d2730')}">가</span><input type="color" id="pgText" value="${attr(doc.pageText||'#1d2730')}"></label>

  function bindPageControls(doc){
    const bg=$("#pgBg"), tx=$("#pgText"), ed=$("#edBody");

  function exportDocImage(doc, type){
    if(typeof html2canvas!=="function"){ toast("이미지 기능을 불러오지 못했습니다"); return; }
    const bg=doc.pageBg||"#ffffff";
    const col=doc.pageText||"#1d2730";   // 내보내기는 위키 테마와 무관하게 항상 읽히게
    const node=document.createElement("div");
    node.className="exp-page";
    node.style.cssText=`position:fixed;left:-99999px;top:0;width:${PAGE_EXPORT_W}px;padding:46px 50px;box-sizing:border-box;`+
      `background:${bg};color:${col};font-family:var(--sans);font-size:15.5px;line-height:1.8`;
    // 내보내기는 밝은 팔레트 고정(위키 다크 테마와 무관) — 강조색만 유지
    const LIGHT={"--surface":"#ffffff","--paper":"#ffffff","--panel":"#e7edf2","--panel-edge":"#d3dde5","--line":"#d3dde5","--ink":"#1d2730","--muted":"#5d6b76","--celadon":"#d2e6f8","--sel":"#dde8f1"};

  /* ================= 위키(세계관) 색 테마 ================= */
  // 테마는 세계관 단위(world.theme). CSS 변수를 :root에 덮어써 앱 전체 색을 바꾼다.
  function _hx(h){ h=String(h||"").replace("#",""); if(h.length===3) h=h.split("").map(c=>c+c).join(""); const n=parseInt(h,16); return isNaN(n)?null:[(n>>16)&255,(n>>8)&255,n&255]; }
  function _rgb(a){ return "#"+a.map(x=>Math.max(0,Math.min(255,Math.round(x))).toString(16).padStart(2,"0")).join(""); }
  function _mix(h1,h2,t){ const a=_hx(h1),b=_hx(h2); if(!a||!b) return h1; return _rgb(a.map((x,i)=>x+(b[i]-x)*t)); }
  // 테마 기본값(현재 azure 팔레트)
  const THEME_DEFAULTS={ accent:"#0c63bd", paper:"#f2f5f8", panel:"#e7edf2", ink:"#1d2730" };
  // 적용할 CSS 변수 계산
  function _lum(hex){ const a=_hx(hex); if(!a) return 1; return (0.2126*a[0]+0.7152*a[1]+0.0722*a[2])/255; }
  function themeVars(theme){
    theme=theme||{};
    const accent=theme.accent||THEME_DEFAULTS.accent;
    const paper=theme.paper||THEME_DEFAULTS.paper;
    const panel=theme.panel||THEME_DEFAULTS.panel;
    const ink=theme.ink||THEME_DEFAULTS.ink;
    const dark=_lum(paper)<0.45;                 // 어두운 배경이면 다크 테마
    const tintBase=dark?paper:"#ffffff";          // 강조 연한톤을 섞을 바탕(다크면 배경 쪽으로)
    const surface = dark ? _mix(panel,"#ffffff",0.07) : "#ffffff";
    return {
      "--rubric":accent, "--hero":accent,
      "--rubric-soft":_mix(accent, dark?"#ffffff":"#ffffff", dark?0.25:0.52),
      "--celadon":_mix(accent, tintBase, dark?0.62:0.82),
      "--sel":_mix(accent, tintBase, dark?0.74:0.9),
      "--paper":paper, "--panel":panel, "--surface":surface,
      "--panel-edge":_mix(panel,ink,dark?0.26:0.14), "--line":_mix(panel,ink,dark?0.26:0.14),
      "--ink":ink, "--muted":_mix(ink,paper,0.42)
    };
  }
  function applyTheme(world){
    const t=(world&&world.theme)||{};
    const vars=themeVars(t);
    const root=document.documentElement;
    const has = t.accent||t.paper||t.panel||t.ink;
    Object.keys(vars).forEach(k=>{
      // 사용자가 아무 것도 안 골랐으면 스타일시트 기본값을 쓰도록 비움
      if(has) root.style.setProperty(k, vars[k]); else root.style.removeProperty(k);
    });
  }

  /* ================= UESP식 확장: 공간·경로·분류문서·서적·내비상자 ================= */

  function normalizeNavbox(n){
    if(!n.id) n.id=uid();
    if(!n.name) n.name="내비 상자";
    if(n.title==null) n.title=n.name;
    if(!Array.isArray(n.groups)) n.groups=[];

  /* ---------- 공간(namespace) ---------- */
  function allNamespaces(){
    const set=new Map();
    Object.values(state.docs).forEach(d=>{ const ns=docNS(d).ns; if(ns) set.set(ns,(set.get(ns)||0)+1); });

  }
  // 링크 해석: 공간을 생략하면 '현재 문서와 같은 공간'을 먼저 찾고, 없으면 전역
  function docByTitleNS(title, fromDoc){
    title=(title||"").trim(); if(!title) return null;
    const n=docNS(title);
    if(!n.ns && fromDoc){ const fns=docNS(fromDoc).ns; if(fns){ const d=docByTitle(fns+":"+title); if(d) return d; } }
    return docByTitle(title);
  }
  // 제목 전체 참조 갱신(본문 링크·경로·서적 연결·인포박스 값·내비상자)
  function retitleEverywhere(oldFull, newFull){
    Object.values(state.docs).forEach(d=>{
      rewriteBodyLinkTitle(d, oldFull, newFull);
      if((d.parent||"")===oldFull) d.parent=newFull;
      if(d.book){ ["prev","up","next"].forEach(k=>{ if((d.book[k]||"")===oldFull) d.book[k]=newFull; }); }
      if(d.infobox && d.infobox.values){ const reT=oldFull.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"); const re=new RegExp("\\[\\["+reT+"(\\|[^\\]]+)?\\]\\]","gi");
        Object.keys(d.infobox.values).forEach(k=>{ const v=d.infobox.values[k]; if(typeof v==="string" && v.indexOf("[[")>=0) d.infobox.values[k]=v.replace(re,(m,l)=>`[[${newFull}${l||""}]]`); }); }
    });
    (state.navboxes||[]).forEach(nb=> nb.groups.forEach(g=>{ g.items=g.items.map(it=> it.trim().toLowerCase()===oldFull.trim().toLowerCase()? newFull : it); }));
  }
  function renameNamespace(oldNs, newNs){
    newNs=(newNs||"").trim();
    if(!/^[^\s:]{1,24}$/.test(newNs)){ toast("공간 이름은 공백·콜론 없이 24자 이내"); return false; }
    if(newNs===oldNs) return true;
    // 매핑 먼저 수집
    const moves=[];
    Object.values(state.docs).forEach(d=>{ const n=docNS(d); if(n.ns===oldNs){ const nf=newNs+":"+n.base; if(docByTitle(nf)){ /* 충돌 */ } moves.push({d, oldFull:d.title, newFull:nf}); } });
    // 충돌 검사
    for(const m of moves){ const ex=docByTitle(m.newFull); if(ex && ex.id!==m.d.id){ toast(`'${m.newFull}' 문서가 이미 있어 바꿀 수 없어요`); return false; } }
    moves.forEach(m=>{ m.d.title=m.newFull; retitleEverywhere(m.oldFull, m.newFull); });
    save(); return true;
  }

  /* ---------- 경로(breadcrumb) · 머리말 ---------- */
  function breadcrumbHTML(doc){
    const ns=docNS(doc).ns;
    const chain=[]; let p=doc.parent, guard=0; const seen=new Set([doc.id]);
    while(p && guard++<12){ const pd=docByTitle(p); chain.unshift({title:p,doc:pd}); if(!pd||seen.has(pd.id)) break; seen.add(pd.id); p=pd.parent; }
    if(!ns && !chain.length) return "";
    let parts=[];
    if(ns) parts.push(`<span class="crumb-ns">${esc(ns)}</span>`);
    chain.forEach(c=>{ const base=docNS(c.title).base; parts.push(c.doc?`<a data-doc="${c.doc.id}">${esc(base)}</a>`:`<span>${esc(base)}</span>`); });
    return `<nav class="crumb"><span class="crumb-lead">‹</span> ${parts.join('<span class="crumb-sep">:</span>')}</nav>`;
  }
  function headnoteHTML(doc){ return doc.headnote? `<div class="headnote">${inline(doc.headnote,doc)}</div>` : ""; }

  function bookBandHTML(doc){

  function navboxHTML(doc){

  function navboxGroupsToText(nb){ return nb.groups.map(g=> (g.label?g.label+" | ":"")+g.items.join(", ")).join("\n"); }
  function textToNavboxGroups(txt){
    return String(txt).split(/\r?\n/).map(s=>s.trim()).filter(Boolean).map(line=>{
      let label="", rest=line; const bar=line.indexOf("|"); if(bar>=0){ label=line.slice(0,bar).trim(); rest=line.slice(bar+1); }
      const items=rest.split(",").map(s=>s.trim().replace(/^\[\[|\]\]$/g,"").trim()).filter(Boolean);
      return {label, items};
    }).filter(g=>g.items.length);
  }

  function openCategory(tagId){ cur.view="wiki"; cur.catTag=tagId; cur.tagFilter=tagId; cur.search=""; renderAll(); if($(".main")) $(".main").scrollTop=0; }
  function renderCategoryPage(){
    const view=$("#view"); view.removeAttribute("style");
    const t=state.tags[cur.catTag];
    if(!t){ cur.catTag=null; renderView(); return; }
    const kids=tagChildren(cur.catTag).sort((a,b)=>sortKo(a.name,b.name));
    const docs=docsForTag(cur.catTag).filter(d=> d.tags.indexOf(cur.catTag)>=0 || kids.length===0 ? true : true); // 이 분류 및 하위 전체
    docs.sort((a,b)=> sortKo(docNS(a).base, docNS(b).base));
    // 서적과 일반 문서 분리

    const groups={}; plains.forEach(d=>{ const L=indexLetter(d.title); (groups[L]=groups[L]||[]).push(d); });
    const letters=Object.keys(groups).sort((a,b)=>{ const o=x=>CHO.includes(x)?[0,CHO.indexOf(x)]:/[A-Z]/.test(x)?[1,x.charCodeAt(0)]:[2,0]; const oa=o(a),ob=o(b); return oa[0]-ob[0]||oa[1]-ob[1]||sortKo(a,b); });
    const docList = plains.length? letters.map(L=>`<div class="cat-grp"><div class="cat-letter">${esc(L)}</div>${groups[L].map(d=>{const n=docNS(d);return `<a class="cat-doc" data-doc="${d.id}">${n.ns?`<span class="idx-ns">${esc(n.ns)}:</span>`:""}${esc(n.base)}</a>`;}).join("")}</div>`).join("") : "";
    // 서적: 제목 – 지은이 – 설명
    const bookList = books.length? `<div class="cat-books"><h4>서적</h4>${books.map(d=>`<a class="cat-book" data-doc="${d.id}"><b>${esc(docNS(d).base)}</b>${d.book&&d.book.author?` <span class="bk-by">– ${esc(d.book.author)}</span>`:""}${d.book&&d.book.desc?` <span class="bk-desc">– ${esc(d.book.desc)}</span>`:""}</a>`).join("")}</div>`:"";

      ${plains.length?`<div class="cat-docs"><h4>문서</h4>${docList}</div>`:(books.length?"":`<div class="idx-empty">이 분류에 문서가 없습니다.</div>`)}`;
    view.querySelectorAll("[data-catopen]").forEach(a=> a.addEventListener("click",()=> openCategory(a.dataset.catopen)));
    view.querySelectorAll("[data-doc]").forEach(a=> a.addEventListener("click",()=> openDoc(a.dataset.doc)));
  }

  /* ================= 단계별 설명(투어) ================= */

  const TOUR_STEPS = [

  function startTour(){
    let i=0;
    function render(){
      const s=TOUR_STEPS[i], n=TOUR_STEPS.length;
      const dots=TOUR_STEPS.map((_,k)=>`<span class="tour-dot${k===i?" on":""}"></span>`).join("");
      showModal(`<div class="tour">
        <div class="tour-step">${i+1} / ${n}</div>
        <h3 style="margin:2px 0 10px">${s.t}</h3>
        <div class="tour-body">${s.h}</div>
        <div class="tour-dots">${dots}</div>
        ${i===n-1&&!READONLY?`<div style="margin-top:12px;text-align:center"><button class="btn" id="tourInstall">이 세계관에 예시·안내 다시 넣기</button></div>`:""}
        <div class="row" style="justify-content:space-between;align-items:center;margin-top:14px">
          <button class="btn" id="tourSkip">건너뛰기</button>
          <span style="display:flex;gap:8px">
            ${i>0?`<button class="btn" id="tourPrev">← 이전</button>`:""}
            <button class="btn primary" id="tourNext">${i<n-1?"다음 →":"시작하기"}</button>
          </span>
        </div></div>`, ()=>{
        try{ localStorage.setItem(TOUR_KEY,"1"); }catch(e){}
        const nx=$("#tourNext"); if(nx) nx.addEventListener("click",()=>{ if(i<n-1){ i++; render(); } else closeModal(); });
        const pv=$("#tourPrev"); if(pv) pv.addEventListener("click",()=>{ i--; render(); });
        const sk=$("#tourSkip"); if(sk) sk.addEventListener("click", closeModal);
        const ins=$("#tourInstall"); if(ins) ins.addEventListener("click",()=>{ closeModal(); installSamples(); });
      });
    }
    render();
  }
  function maybeAutoTour(){
    if(READONLY) return;
    let seen=false; try{ seen=localStorage.getItem(TOUR_KEY)==="1"; }catch(e){}
    if(!seen) setTimeout(startTour, 400);
  }

  /* ================= 통계표(비교표) ================= */
  // 인포박스 값을 라벨별로 모아, 세계관 단위/여러 개/전체로 비교표를 만든다. 분류별 접기 + 이미지 저장.

  function statsDefault(){
    return { worldIds:[library.currentId], group:"none", cols:null, onlyInfobox:true, collapsed:{} };
  }
  // 한 세계관의 템플릿으로 doc의 인포박스를 라벨→값으로
  function docLabelMap(world, d){
    const out={};
    if(d.infobox && d.infobox.values){
      const tpl=(world.infoboxTemplates||[]).find(t=>t.id===d.infobox.templateId);
      if(tpl) tpl.fields.forEach(f=>{ if(f.type!=="section"&&f.type!=="image"){ const v=d.infobox.values[f.id]; if(v!=null && String(v).trim()!=="") out[f.label]=String(v); } });
    }
    return out;
  }
  function stripLinks(s){ return String(s||"").replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g,(m,a,b)=>(b||a).trim()); }
  // 선택된 세계관들의 행 수집
  function statsRows(S){
    const rows=[];
    S.worldIds.forEach(wid=>{
      const w=library.worlds[wid]; if(!w) return;
      Object.values(w.docs).forEach(d=>{
        const lm=docLabelMap(w,d);
        if(S.onlyInfobox && Object.keys(lm).length===0) return;
        const ns=docNS(d).ns;
        const tagNames=(d.tags||[]).map(id=> (w.tags[id]?w.tags[id].name:null)).filter(Boolean);
        rows.push({ world:w, worldName:w.meta.name, name:docNS(d).base, ns, tags:tagNames,
          topTag: tagNames[0]||"(분류 없음)", labels:lm, docId:d.id, _wid:wid });
      });
    });
    return rows;
  }
  // 선택 세계관들에서 등장하는 모든 라벨(열 후보)
  function statsAllLabels(S){
    const set=new Map();
    statsRows(Object.assign({},S,{onlyInfobox:false})).forEach(r=> Object.keys(r.labels).forEach(l=> set.set(l,(set.get(l)||0)+1)));
    return [...set.entries()].sort((a,b)=> b[1]-a[1] || sortKo(a[0],b[0])).map(e=>e[0]);
  }
  function statsGroupKey(S,r){
    if(S.group==="ns") return r.ns||"(공간 없음)";
    if(S.group==="world") return r.worldName;
    if(S.group==="none") return "";
    return r.topTag; // tag
  }

  function renderStatsWorkspace(){
    const view=$("#view"); view.removeAttribute("style");
    if(!cur.stats) cur.stats=statsDefault();
    const S=cur.stats;
    // 유효 세계관만
    S.worldIds=S.worldIds.filter(id=>library.worlds[id]);
    if(!S.worldIds.length) S.worldIds=[library.currentId];
    const allLabels=statsAllLabels(S);
    if(S.cols===null) S.cols = allLabels.slice(0,6);        // 기본: 많이 쓰인 라벨 6개
    const cols=S.cols.filter(c=>allLabels.includes(c));

    // 컨트롤 패널
    const worldChecks=Object.values(library.worlds).sort((a,b)=>sortKo(a.meta.name,b.meta.name)).map(w=>
      `<label class="st-chk"><input type="checkbox" data-stworld="${w.meta.id}" ${S.worldIds.includes(w.meta.id)?"checked":""}> ${esc(w.meta.name)} <span class="st-dim">${Object.keys(w.docs).length}</span></label>`).join("");
    const colChecks=allLabels.length? allLabels.map(l=>
      `<label class="st-chk"><input type="checkbox" data-stcol="${attr(l)}" ${cols.includes(l)?"checked":""}> ${esc(l)}</label>`).join("")
      : `<span class="st-dim">인포박스가 있는 문서가 없어요. 문서에 인포박스를 넣으면 항목이 여기에 떠요.</span>`;
    const groupOpts=[["tag","분류별"],["ns","공간별"],["world","세계관별"],["none","묶지 않음"]].map(([v,t])=>`<option value="${v}" ${S.group===v?"selected":""}>${t}</option>`).join("");

    const panel=`<aside class="st-panel">
      <div class="st-sec"><div class="st-h">세계관 선택</div><div class="st-list">${worldChecks}</div></div>
      <div class="st-sec"><div class="st-h">묶음</div><select id="stGroup" class="st-sel">${groupOpts}</select>
        <label class="st-chk" style="margin-top:8px"><input type="checkbox" id="stOnlyIb" ${S.onlyInfobox?"checked":""}> 인포박스 있는 문서만</label></div>
      <div class="st-sec"><div class="st-h">항목(열) — ‘이름’은 항상 표시</div><div class="st-list st-cols">${colChecks}</div></div>
    </aside>`;

    view.innerHTML=`<div id="stw">
      ${panel}
      <main class="st-stage">
        <div class="st-toolbar">
          <span class="st-title">통계표 <span class="st-dim" id="stCount"></span></span>
          <span class="sp"></span>
          <button class="btn" id="stCsv">CSV 저장</button>
          <button class="btn primary" id="stPng">이미지로 저장</button>
        </div>
        <div class="st-scroll"><div id="stTableWrap"></div></div>
      </main></div>`;

    // 컨트롤 바인딩
    view.querySelectorAll("[data-stworld]").forEach(cb=> cb.addEventListener("change",()=>{
      const id=cb.dataset.stworld;
      if(cb.checked){ if(!S.worldIds.includes(id)) S.worldIds.push(id); } else S.worldIds=S.worldIds.filter(x=>x!==id);
      S.cols=null; renderStatsWorkspace();
    }));
    view.querySelectorAll("[data-stcol]").forEach(cb=> cb.addEventListener("change",()=>{
      const l=cb.dataset.stcol;
      if(cb.checked){ if(!S.cols.includes(l)) S.cols.push(l); } else S.cols=S.cols.filter(x=>x!==l);
      renderStatsTable();
    }));
    $("#stGroup").addEventListener("change",e=>{ S.group=e.target.value; renderStatsTable(); });
    $("#stOnlyIb").addEventListener("change",e=>{ S.onlyInfobox=e.target.checked; S.cols=null; renderStatsWorkspace(); });
    $("#stCsv").addEventListener("click", exportStatsCSV);
    $("#stPng").addEventListener("click", exportStatsImage);
    renderStatsTable();
  }

  function statsTableHTML(forExport){
    const S=cur.stats; const cols=(S.cols||[]).filter(Boolean);
    const rows=statsRows(S);
    // 그룹핑
    const groups={}; rows.forEach(r=>{ const k=statsGroupKey(S,r); (groups[k]=groups[k]||[]).push(r); });
    const keys=Object.keys(groups).sort((a,b)=>sortKo(a,b));
    const headCells=`<th class="st-name">이름</th>`+(S.group!=="world"?`<th class="st-small">세계관</th>`:"")+cols.map(c=>`<th>${esc(c)}</th>`).join("");
    const ncol=1+(S.group!=="world"?1:0)+cols.length;
    let body="";
    const cell=(r,c)=>{ const v=r.labels[c]; return v? esc(stripLinks(v)) : `<span class="st-blank">·</span>`; };
    keys.forEach(k=>{
      const list=groups[k].sort((a,b)=>sortKo(a.name,b.name));
      if(S.group!=="none"){
        const collapsed=!forExport && S.collapsed[k];
        body+=`<tr class="st-grp${collapsed?" collapsed":""}" data-stgrp="${attr(k)}"><td colspan="${ncol}"><span class="st-tw">${collapsed?"▸":"▾"}</span> ${esc(k)} <span class="st-dim">${list.length}</span></td></tr>`;
        if(collapsed) return;
      }
      list.forEach(r=>{
        body+=`<tr>`+
          `<td class="st-name"><a data-stdoc="${r._wid}:${r.docId}">${esc(r.name)}</a></td>`+
          (S.group!=="world"?`<td class="st-small st-dim">${esc(r.worldName)}</td>`:"")+
          cols.map(c=>`<td>${cell(r,c)}</td>`).join("")+`</tr>`;
      });
    });
    if(!rows.length) body=`<tr><td colspan="${ncol}" class="st-empty">조건에 맞는 문서가 없어요. 세계관을 고르고 문서에 인포박스를 넣어 보세요.</td></tr>`;
    const title=forExport? `<div class="st-cap">${esc(S.worldIds.map(id=>library.worlds[id]&&library.worlds[id].meta.name).filter(Boolean).join(" · "))} — 통계표</div>`:"";
    return `${title}<table class="st-table"><thead><tr>${headCells}</tr></thead><tbody>${body}</tbody></table>`;
  }
  function renderStatsTable(){
    const wrap=$("#stTableWrap"); if(!wrap) return;
    wrap.innerHTML=statsTableHTML(false);
    const cnt=$("#stCount"); if(cnt){ const n=statsRows(cur.stats).length; cnt.textContent=`· 문서 ${n}개 · 항목 ${(cur.stats.cols||[]).length}개`; }
    wrap.querySelectorAll("[data-stgrp]").forEach(tr=> tr.addEventListener("click",()=>{
      const k=tr.getAttribute("data-stgrp"); cur.stats.collapsed[k]=!cur.stats.collapsed[k]; renderStatsTable();
    }));
    wrap.querySelectorAll("[data-stdoc]").forEach(a=> a.addEventListener("click",()=>{
      const [wid,did]=a.getAttribute("data-stdoc").split(":");
      if(wid!==library.currentId) setCurrentWorld(wid);
      cur.view="wiki"; openDoc(did);
    }));
  }

  function exportStatsCSV(){
    const S=cur.stats; const cols=(S.cols||[]).filter(Boolean);
    const rows=statsRows(S).sort((a,b)=> sortKo(statsGroupKey(S,a),statsGroupKey(S,b))||sortKo(a.name,b.name));
    const head=["이름"].concat(S.group!=="world"?["세계관"]:[]).concat(S.group!=="none"?["묶음"]:[]).concat(cols);
    const esc2=s=>{ s=stripLinks(s==null?"":s); return /[",\n]/.test(s)? '"'+s.replace(/"/g,'""')+'"' : s; };
    const lines=[head.map(esc2).join(",")];
    rows.forEach(r=>{ const line=[r.name].concat(S.group!=="world"?[r.worldName]:[]).concat(S.group!=="none"?[statsGroupKey(S,r)]:[]).concat(cols.map(c=>r.labels[c]||"")); lines.push(line.map(esc2).join(",")); });
    const url="data:text/csv;charset=utf-8,﻿"+encodeURIComponent(lines.join("\r\n"));
    tlDownload("통계표.csv", url); toast("CSV로 저장했어요");
  }
  function exportStatsImage(){
    if(typeof html2canvas!=="function"){ toast("이미지 기능을 불러오지 못했습니다"); return; }
    const node=document.createElement("div");
    node.className="st-export";
    node.style.cssText="position:fixed;left:-99999px;top:0;padding:26px;background:#ffffff;color:#1d2730;font-family:var(--sans);"+
      "--surface:#ffffff;--paper:#ffffff;--panel:#e7edf2;--panel-edge:#d3dde5;--line:#d3dde5;--ink:#1d2730;--muted:#5d6b76;--rubric:#0c63bd;--celadon:#d2e6f8;--sel:#dde8f1";
    node.innerHTML=statsTableHTML(true);
    document.body.appendChild(node);
    const cleanup=()=>{ if(node.parentNode) document.body.removeChild(node); };
    html2canvas(node,{backgroundColor:"#ffffff",scale:2,useCORS:true,logging:false})
      .then(cv=>{ cleanup(); cv.toBlob(b=>{ if(!b){toast("이미지 변환 실패");return;} const u=URL.createObjectURL(b); tlDownload("통계표.png",u); setTimeout(()=>URL.revokeObjectURL(u),5000); toast("이미지로 저장했어요"); },"image/png"); })
      .catch(e=>{ cleanup(); toast("이미지 변환 실패: "+(e&&e.message||e)); });
  }

  /* ---------- 시작 ---------- */
  function init(){
    library = load();
    setCurrentWorld(library.currentId);
    if(READONLY){
      // 복사·잘라내기·붙여넣기·우클릭·드래그·선택 차단 (검색창은 예외)
      document.body.classList.add("locked");
      const inSearch = e => e.target && e.target.id==="searchIn";
      ["copy","cut","paste","contextmenu","dragstart","selectstart"].forEach(ev=>{
        document.addEventListener(ev, e=>{ if(inSearch(e)) return; e.preventDefault(); }, true);
      });
    } else {
      $("#worldName").addEventListener("input", e=>{ state.meta.name=e.target.value; save(); renderSide(); });
      $("#worldName").addEventListener("blur",()=>{ if(!state.meta.name.trim()){ state.meta.name="이름 없는 세계"; $("#worldName").value=state.meta.name; save(); renderSide(); }});
    }
    $("#menuToggle").addEventListener("click", e=>{
      e.stopPropagation();
      const open = $("#side").classList.toggle("open");
      $("#sideBackdrop").classList.toggle("show", open);
    });
    $("#sideBackdrop").addEventListener("click", closeSideMobile);
    // 더보기 메뉴: 바깥을 누르면 닫기
    document.addEventListener("click", e=>{
      const mm=$("#moreMenu");
      if(mm && mm.classList.contains("open") && !(e.target.closest && e.target.closest(".more-wrap"))) mm.classList.remove("open");
    });
    document.addEventListener("keydown", e=>{
      if(READONLY){
        const k=(e.key||"").toLowerCase();
        if((e.ctrlKey||e.metaKey) && ["c","x","v","a","s","p"].includes(k) && !(e.target&&e.target.id==="searchIn")){ e.preventDefault(); }
        return;
      }
      if((e.ctrlKey||e.metaKey)&&e.key==="s"){ e.preventDefault(); if(cur.mode==="edit") saveEditor(); else exportHTML(); }
      if((e.ctrlKey||e.metaKey)&&e.key==="e"){ e.preventDefault(); if(cur.docId){ cur.mode=cur.mode==="edit"?"view":"edit"; renderAll(); } }
    });
    injectFonts();
    applyTheme(state);
    renderAll();
    if(!READONLY) restoreDriveSession();   // 로그인 유지: 저장된 토큰/세션으로 조용히 재연결
    maybeAutoTour();                        // 처음 열면 단계별 설명 자동 안내
  }
  init();
})();
</script>
</body>
</html>
